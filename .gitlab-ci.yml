# Pipeline-level filter. Without this GitLab runs both a branch pipeline AND
# an MR pipeline when an MR is open on a branch — double cost. Order matters:
# the explicit `when: never` for "push when an MR is open" must come before
# the main-branch and tag rules so it isn't shadowed.
workflow:
  # When a newer commit lands on the same ref — an MR re-push, or a merge onto
  # main — cancel the superseded pipeline's interruptible jobs instead of
  # stacking a second full run behind it on the single serialized amd64 runner.
  # `interruptible` cancels per job with no latch: a running `interruptible:
  # false` job (the publish/side-effect jobs below) does NOT protect the rest of
  # the pipeline from cancellation, which is why those jobs opt out individually
  # rather than relying on the `conservative` mode's whole-pipeline behaviour.
  # Requires Settings > CI/CD > General pipelines > "Auto-cancel redundant
  # pipelines" to be enabled; with it off this block and every `interruptible:`
  # below are inert.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    # Scheduled pipelines run the time-driven scans only (see
    # .runs-on-ci-or-schedule). CVE disclosure is not an event in this repo's
    # history, so an event-driven SCA goes blind for as long as the repo is quiet.
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Every job is cancellable by default, so a superseded pipeline stops burning
# the shared runner. The exceptions are the jobs with an external side effect
# that must not be cut mid-flight — a registry push, an SBOM upload, a mirror
# push — each of which sets `interruptible: false` at its own definition.
default:
  interruptible: true
  # Image pulls resolve DEP_IMAGE_REGISTRY on the runner host's docker daemon,
  # before any job script runs; a name-resolution blip there fails the job with
  # runner_system_failure and skips every downstream job in the pipeline. Retry
  # that class only — a script_failure is a real result and must never be
  # retried into a false green.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - validate
  - build
  - test
  - sbom
  - ai-review      # advisory LLM review of the MR diff (local Ollama)
  - dast
  - release        # publish the runtime image to the Dependably registry
  - staging        # deploy that published image to the staging host
  - mirror         # manual: mirror a release tag to GitHub

# OCI pull-through mirror for CI container images. Override DEP_IMAGE_REGISTRY
# per-fork or unset (set to empty string) to fall back to pulling directly from
# the public registries. Requires the instance's Oci:Upstreams to route
# docker.io and mcr.microsoft.com, and a DOCKER_AUTH_CONFIG CI/CD variable
# for authenticated pulls (GitLab's standard mechanism for OCI credentials).
variables:
  DEP_IMAGE_REGISTRY: "dependably.northwardlabs.ca"
  # glsec release consumed by ci-config-lint and mirrored by mirror-glsec. Both
  # jobs read these, so the version and its digest are pinned in one place; bump
  # them together and the next main pipeline republishes the mirrored copy.
  GLSEC_VERSION: "1.7.0"
  GLSEC_SHA256: "1d906a5a1ae51f1a2e787f49e2666168821a852559481130b154d21ed6e174a8"

# All job images are pinned by digest; bump tag+digest together.
# No container image is built in CI (deploy builds locally via docker compose), so no image-scanning job exists by design.

# Release-tag predicate. Single source of truth — referenced from
# .runs-on-ci{,-main} so branch and tag execution share entry conditions,
# and from validate-release-tag / release-gate / release-to-github so the
# regex lives in exactly one place.
.release-tag-rule: &release-tag-rule
  if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# MR-gated jobs (build/test/scan/sbom). Also fire on main pushes (post-merge
# re-run) and on release-tag pipelines so the release gate has something to
# enforce. Branch pushes without an MR are filtered out by the workflow rule.
.runs-on-ci:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - *release-tag-rule

# Same coverage as .runs-on-ci, plus scheduled pipelines. Carried by the scans
# whose subject changes without anyone touching the repo: a CVE disclosed against
# an already-pinned transitive dependency, or a credential committed to a branch
# nobody has opened an MR for. Deliberately a separate provider rather than a
# schedule rule on .runs-on-ci — the latter would run the entire MR job set
# nightly on the single serialized runner to re-derive results that cannot have
# changed, since the inputs are the same commit.
.runs-on-ci-or-schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - *release-tag-rule

# Post-merge-only jobs: side effects on real systems (DT publish) and scans
# scoped to main to avoid per-MR noise (sonarqube-check). Release-tag inclusion
# stays — removing it silently weakens the release gate by skipping required
# jobs on tag pipelines.
.runs-on-ci-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - *release-tag-rule

# Release-tag-only jobs (validate-release-tag, release-gate). Lets required
# jobs that only ever run on release tags inherit their rule from an anchor
# rather than declaring inline — keeps them inside release-contract-lint's
# RULE_PROVIDERS set.
.runs-on-release-tag:
  rules:
    - *release-tag-rule

# Marker template. Sets a single inherited env var so the marker is visible
# at runtime (and so GitLab accepts the hidden job — empty `{}` is rejected
# as "config can't be blank"). Every job whose pass is required for a
# release to ship extends this AND one of .runs-on-ci{,-main}; drift caught
# by release-contract-lint.
.release-required:
  variables:
    RELEASE_REQUIRED: "true"

# Single list of required jobs, in canonical needs-object form so the alias
# expands into exactly the shape GitLab expects. `artifacts: false` because
# release-gate only cares about pass/fail. Edit here when adding/removing a
# required job; release-contract-lint enforces equality with the set of jobs
# that extend .release-required.
.release-required-jobs: &release-required-jobs
  - { job: validate-release-tag,   artifacts: false }
  - { job: lockfile-registry-guard, artifacts: false }
  - { job: build,                  artifacts: false }
  - { job: lint,                   artifacts: false }
  - { job: dotnet-format,          artifacts: false }
  - { job: csp-inline-style-guard, artifacts: false }
  - { job: sql-interp-guard,       artifacts: false }
  - { job: i18n-validate,          artifacts: false }
  - { job: secret-scan,            artifacts: false }
  - { job: unit-tests,             artifacts: false }
  - { job: api-contract,           artifacts: false }
  - { job: integration-tests,      artifacts: false }
  - { job: schema-integrity,       artifacts: false }
  - { job: frontend-tests,         artifacts: false }
  - { job: e2e,                    artifacts: false }
  - { job: sbom-backend,           artifacts: false }
  - { job: sbom-frontend,          artifacts: false }
  - { job: dt-publish,             artifacts: false }
  - { job: zap-full,               artifacts: false }
  - { job: zap-api-management,     artifacts: false }
  - { job: zap-api-protocol,       artifacts: false }
  - { job: sca-backend,            artifacts: false }
  - { job: sca-frontend,           artifacts: false }

# Registry credentials are split by capability, because an MR pipeline runs code authored in
# the merge request and therefore sees every unprotected variable:
#
#   REGISTRY_KEY         — READ/restore only. Unprotected on purpose, so MR pipelines can
#                          resolve dependencies through the private feed instead of falling
#                          back to public registries. Restoring is read-only, so an MR that
#                          exfiltrates this token gains read access to the mirror, not the
#                          ability to overwrite a published image or package.
#   REGISTRY_PUBLISH_KEY — PUBLISH (publish:oci). Protected + masked, so it is exposed only on
#                          protected refs (`main`, `v*` tags) and is invisible to a
#                          feature-branch MR pipeline even when the MR fully controls the job
#                          script. Referenced only by the jobs that push images.
#
# Only the read key is wired into npm/NuGet below. HARD-FAILS when either REGISTRY_URL or
# REGISTRY_KEY is empty rather than silently falling back to public — the GitLab pipeline must
# always use the private feed. (GitHub Actions intentionally stays on public; see
# .github/workflows.)
# The generated `<packageSources>` — the element package bytes are actually downloaded through —
# is always the private feed, for every job, unconditionally. A job that also needs advisory
# data from a public source it doesn't otherwise trust (NuGet advisory data lives only on
# nuget.org; there is no private-feed equivalent) opts in by setting `NUGET_AUDIT_SOURCE`, which
# is written as an `<auditSources>` entry alongside the private `<packageSources>` — never in
# place of it.
.private-registry-setup:
  before_script:
    - |
      # No `set -eu` here: GitLab concatenates before_script + script into one shell, so a
      # stray `set -u` would leak into the job script and trip on optional unset vars. Use
      # explicit checks + `exit 1` (which aborts the job) instead.
      if [ -z "${REGISTRY_URL:-}" ] || [ -z "${REGISTRY_KEY:-}" ]; then
        echo "ERROR: REGISTRY_URL/REGISTRY_KEY are empty — refusing to restore from public registries." >&2
        echo "Both are unprotected project CI/CD variables; an empty value means they were removed or scoped out (e.g. a fork pipeline)." >&2
        exit 1
      fi
      HOST=$(printf '%s' "$REGISTRY_URL" | sed -E 's|^https?://||; s|/.*||')
      printf 'registry=%s/npm/\n//%s/npm/:_authToken=%s\nfund=false\n' \
        "$REGISTRY_URL" "$HOST" "$REGISTRY_KEY" > "$HOME/.npmrc"
      # Write LOWERCASE nuget.config so it OVERWRITES the committed public one. On a
      # case-sensitive Linux runner NuGet checks "nuget.config" before "NuGet.Config" and
      # returns on the first match, so a capital-N file is shadowed by the committed lowercase
      # one. Same path => exactly one config => the private feed wins deterministically.
      {
        echo '<?xml version="1.0" encoding="utf-8"?>'
        echo '<configuration>'
        echo '  <packageSources>'
        echo '    <clear />'
        echo "    <add key=\"dependably\" value=\"${REGISTRY_URL}/nuget/v3/index.json\" />"
        echo '  </packageSources>'
        echo '  <packageSourceCredentials>'
        echo '    <dependably>'
        echo '      <add key="Username" value="ci" />'
        echo "      <add key=\"ClearTextPassword\" value=\"${REGISTRY_KEY}\" />"
        echo '    </dependably>'
        echo '  </packageSourceCredentials>'
        if [ -n "${NUGET_AUDIT_SOURCE:-}" ]; then
          echo '  <auditSources>'
          echo "    <add key=\"audit\" value=\"${NUGET_AUDIT_SOURCE}\" />"
          echo '  </auditSources>'
        fi
        echo '</configuration>'
      } > "$CI_PROJECT_DIR/nuget.config"
      # Self-check: the npm config must never reference a public registry.
      if grep -qiE 'registry\.npmjs\.org' "$HOME/.npmrc"; then
        echo "ERROR: generated .npmrc still references a public host:" >&2
        grep -niE 'registry\.npmjs\.org' "$HOME/.npmrc" >&2
        exit 1
      fi
      # Self-check: the active <packageSources> — the element NuGet actually downloads package
      # bytes through — must reference the private host and never a public one. Scoped to that
      # element (not the whole file) so an opted-in <auditSources> entry naming nuget.org doesn't
      # trip it: the guard's intent is "no public source ever serves us package bytes", and a
      # future regression that re-adds a public packageSource still fails this loudly.
      PACKAGE_SOURCES_BLOCK=$(awk '/<packageSources>/,/<\/packageSources>/' "$CI_PROJECT_DIR/nuget.config")
      if printf '%s' "$PACKAGE_SOURCES_BLOCK" | grep -qiE 'api\.nuget\.org|registry\.npmjs\.org'; then
        echo "ERROR: generated nuget.config packageSources still references a public host:" >&2
        printf '%s' "$PACKAGE_SOURCES_BLOCK" | grep -niE 'api\.nuget\.org|registry\.npmjs\.org' >&2
        exit 1
      fi
      if ! grep -qF "$HOST" "$CI_PROJECT_DIR/nuget.config"; then
        echo "ERROR: nuget.config does not reference the private host '$HOST' after write." >&2
        exit 1
      fi
      # Effective-config guard. The greps above only inspect the file we just wrote; a public
      # source living in an inherited machine/user config (~/.nuget/NuGet/NuGet.Config, a global
      # npmrc) merges in without touching that file. `<clear/>` drops inherited package *sources*,
      # but disabledPackageSources / packageSourceMapping and npm's precedence rules don't, so
      # assert the RESOLVED config — not the written file. Each check is gated on its toolchain
      # because this template is shared by dotnet and node jobs. `dotnet nuget list source`
      # reports registered packageSources only, never auditSources (verified against the SDK
      # image this template runs under), so an opted-in public auditSources entry cannot trip
      # this check.
      if command -v dotnet >/dev/null 2>&1; then
        if dotnet nuget list source 2>/dev/null | grep -qiE 'api\.nuget\.org|registry\.npmjs\.org'; then
          echo "ERROR: effective NuGet config lists a public source (inherited from a machine/user config):" >&2
          dotnet nuget list source >&2
          exit 1
        fi
      fi
      if command -v npm >/dev/null 2>&1; then
        eff=$(npm config get registry 2>/dev/null)
        want="${REGISTRY_URL}/npm/"
        case "$eff" in
          "$want"|"${want%/}") : ;;
          *) echo "ERROR: effective npm registry is '$eff', not the private feed '$want' (overridden by an inherited npmrc)." >&2; exit 1 ;;
        esac
      fi

# Exports `API_BASE`, a GitLab v4 API root that actually resolves from a runner.
# `CI_API_V4_URL` inherits the instance `external_url`, which on this instance names a
# host runners cannot resolve; `CI_REPOSITORY_URL` carries the host the runner really
# clones from, so its authority is the reliable one. Prefer that, fall back to
# `CI_API_V4_URL` when the repository URL is absent (GIT_STRATEGY: none leaves it set,
# but a future caller might not have it). Userinfo is stripped — `CI_REPOSITORY_URL`
# embeds `gitlab-ci-token:<job token>@`, which must never reach a URL that gets echoed.
# `ci/ai-review.sh` solves the same problem for MR comments; keep the two in step.
# Referenced (not extended) directly above the first API call in a job's script.
.gitlab-api-base:
  script:
    - |
      # No `set -eu` — this block is concatenated into the job's single shell
      # invocation, so a stray `set -u` would leak into later script lines.
      API_HOST=$(printf '%s' "${CI_REPOSITORY_URL:-}" | sed -E 's|^[a-z]+://||; s|^[^@]*@||; s|/.*||')
      if [ -n "$API_HOST" ]; then
        API_BASE="https://${API_HOST}/api/v4"
      else
        API_BASE="${CI_API_V4_URL:-}"
      fi
      if [ -z "$API_BASE" ]; then
        echo "ERROR: neither CI_REPOSITORY_URL nor CI_API_V4_URL is set — cannot address the GitLab API." >&2
        exit 1
      fi
      echo "GitLab API base: ${API_BASE}"

# Wires `REGISTRY_URL` + `REGISTRY_KEY` (the same unprotected read-only project CI variables
# used by `.private-registry-setup`) into apk so runtime package fetches route through the private
# Dependably instance's apk pull-through proxy instead of the public Alpine CDN. HARD-FAILS
# when either var is empty rather than silently falling back to public — the GitLab pipeline
# must always use the private feed. The apk route is 1:1 with dl-cdn paths
# (/apk/{release}/{repo}/{arch}/{file}), so rewriting the host prefix in
# /etc/apk/repositories is the only client change needed. Referenced (not extended) directly
# above each `apk add` call, since it must run immediately before that call rather than once
# per job.
.apk-mirror-setup:
  script:
    - |
      # No `set -eu` here: this block is inserted as one item in a job's `script:` list, and
      # GitLab concatenates every item into a single shell invocation — a stray `set -u` would
      # leak into later script lines and trip on optional unset vars. Use explicit checks +
      # `exit 1` (which aborts the job) instead.
      if [ -z "${REGISTRY_URL:-}" ] || [ -z "${REGISTRY_KEY:-}" ]; then
        echo "ERROR: REGISTRY_URL/REGISTRY_KEY are empty — refusing to fetch apk packages from the public mirror." >&2
        echo "Both are unprotected project CI/CD variables; an empty value means they were removed or scoped out (e.g. a fork pipeline)." >&2
        exit 1
      fi
      SCHEME=$(printf '%s' "$REGISTRY_URL" | sed -E 's|^(https?)://.*|\1|')
      HOST=$(printf '%s' "$REGISTRY_URL" | sed -E 's|^https?://||; s|/.*||')
      sed -i -E "s|https://dl-cdn\.alpinelinux\.org/alpine|${SCHEME}://ci:${REGISTRY_KEY}@${HOST}/apk|g" /etc/apk/repositories
      # Self-check: the active repositories file must never fall back to the public mirror.
      # The diagnostic print strips URL userinfo (`//user:token@host` -> `//***@host`) before it
      # reaches the job trace. Job traces on this project are readable by every member down to
      # Guest, and GitLab's variable masking silently declines values that fail its masking
      # requirements — so redaction here is the control, not a second line of defence.
      if grep -q dl-cdn /etc/apk/repositories; then
        echo "ERROR: /etc/apk/repositories still references dl-cdn.alpinelinux.org after rewrite:" >&2
        sed -E 's|//[^@]*@|//***@|g' /etc/apk/repositories >&2
        exit 1
      fi

# === validate ===

# Single authority for tag identity. Owns: annotated-tag check, tag→commit
# binding, ancestor-of-main check, Directory.Build.props version match.
# Downstream scripts must not re-validate these.
validate-release-tag:
  stage: validate
  extends: [.runs-on-release-tag, .release-required]
  # alpine/git's entrypoint is `git`; override so the runner's shell wrapper
  # can execute the step script (otherwise it runs as `git sh ...`).
  image:
    name: ${DEP_IMAGE_REGISTRY}/alpine/git@sha256:d453f54c83320412aa89c391b076930bd8569bc1012285e8c68ce2d4435826a3
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: fetch
  script:
    - |
      set -eu
      TAG="$CI_COMMIT_TAG"
      VERSION="${TAG#v}"
      git fetch origin --tags --force
      git fetch origin main
      [ "$(git cat-file -t "$TAG")" = "tag" ] \
        || { echo "ERROR: tag $TAG must be annotated, not lightweight" >&2; exit 1; }
      TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
      [ "$TAG_COMMIT" = "$CI_COMMIT_SHA" ] \
        || { echo "ERROR: tag $TAG points at $TAG_COMMIT, pipeline ran on $CI_COMMIT_SHA" >&2; exit 1; }
      git merge-base --is-ancestor "$TAG_COMMIT" origin/main \
        || { echo "ERROR: tag commit $TAG_COMMIT not reachable from origin/main" >&2; exit 1; }
      FILE_VERSION=$(grep -oE '<Version>[^<]+</Version>' Directory.Build.props \
        | sed -E 's|<Version>(.*)</Version>|\1|')
      [ "$FILE_VERSION" = "$VERSION" ] \
        || { echo "ERROR: tag $TAG implies version $VERSION but Directory.Build.props has $FILE_VERSION" >&2; exit 1; }
      echo "Tag identity verified: $TAG → $TAG_COMMIT (version $VERSION, ancestor of main)"

# Reconciles the release contract on every push: the set of jobs extending
# .release-required must equal release-gate.needs, and every required job
# must inherit its release-tag rule from .runs-on-ci{,-main} (no inline
# `rules:`, no other rule-providing template). Drift fails at MR/branch
# time, not at release time.
release-contract-lint:
  stage: validate
  extends: .runs-on-ci
  # alpine:3 (not python:3-alpine) so apk's py3-yaml lands in the same
  # python path that `python3` resolves to. The official python image keeps
  # its interpreter under /usr/local and ignores Alpine's site-packages.
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache python3 py3-yaml
    - |
      python3 <<'PY'
      import sys, yaml
      # plain safe_load has no constructor for GitLab's `!reference [job, key]` tag
      # (used by .apk-mirror-setup call sites); register one that resolves it to the
      # raw [job, key] pair. The checks below only inspect job-level keys (extends,
      # rules, script/trigger/run presence), never script *contents*, so a
      # structurally-inert placeholder is sufficient.
      class Loader(yaml.SafeLoader):
          pass
      Loader.add_constructor('!reference', lambda loader, node: loader.construct_sequence(node))
      with open('.gitlab-ci.yml') as f:
          doc = yaml.load(f, Loader=Loader)
      # Concrete jobs: dict-valued, non-dot-prefixed (excludes templates/anchors),
      # carrying any of GitLab's three runnable primitives. `default:`,
      # `workflow:`, `variables:`, etc. carry none of these. If a future job
      # inherits its runnable purely via `extends:` (none today), broaden the
      # discriminator — the lint failure is loud.
      RUNNABLE = {'script', 'trigger', 'run'}
      jobs = {k: v for k, v in doc.items()
              if isinstance(v, dict) and not k.startswith('.')
              and RUNNABLE & v.keys()}
      def extends_of(job):
          e = job.get('extends')
          return [e] if isinstance(e, str) else (e or [])
      required = sorted(name for name, job in jobs.items()
                        if '.release-required' in extends_of(job))
      gate_needs = sorted(
          n['job'] if isinstance(n, dict) else n
          for n in doc.get('release-gate', {}).get('needs', [])
      )
      errs = []
      if required != gate_needs:
          missing = set(required) - set(gate_needs)
          extra   = set(gate_needs) - set(required)
          if missing: errs.append(f"missing from .release-required-jobs anchor: {sorted(missing)}")
          if extra:   errs.append(f"extra in gate but no marker:                {sorted(extra)}")
      # Bypass guard: a required job must inherit its release-tag rule from
      # .runs-on-ci{,-main}. Any other `rules:` source — inline on the job,
      # or via another extended template — wins under GitLab's extends
      # merging and would silently skip the job on tag pipelines.
      RULE_PROVIDERS = {'.runs-on-ci', '.runs-on-ci-or-schedule', '.runs-on-ci-main',
                        '.runs-on-release-tag'}
      for name in required:
          job = jobs[name]
          ext = extends_of(job)
          if 'rules' in job:
              errs.append(f"{name}: required jobs must not define inline `rules:`; "
                          f"inherit from .runs-on-ci{{,-main}} instead")
          if not (set(ext) & RULE_PROVIDERS):
              errs.append(f"{name}: required jobs must also extend .runs-on-ci or "
                          f".runs-on-ci-main so release-tag-rule applies")
          for t in ext:
              if t in RULE_PROVIDERS or t == '.release-required':
                  continue
              tmpl = doc.get(t)
              if isinstance(tmpl, dict) and 'rules' in tmpl:
                  errs.append(f"{name}: extends `{t}` which defines `rules:` — that "
                              f"would override .runs-on-ci{{,-main}} under GitLab's "
                              f"extends merging. Remove rules from that template or "
                              f"refactor into a new anchor that re-includes "
                              f"*release-tag-rule.")
      if errs:
          for e in errs:
              print("release-contract-lint:", e, file=sys.stderr)
          sys.exit(1)
      print(f"release-contract-lint: {len(required)} required jobs, gate aligned.")
      PY

# Scans .gitlab-ci.yml for supply-chain and security misconfigurations using glsec
# (https://github.com/glsec/glsec), the zizmor-equivalent linter for GitLab CI.
# --strict promotes warn-level findings to errors; skipped rules are accepted trade-offs:
#   GL022 — container images are already digest-pinned; apk/apt package version pins add
#           no supply-chain value when the image layer is immutable.
#   GL024 — scripts use explicit set -eu + exit 1 guards instead of pipefail; the pattern
#           is intentional throughout this pipeline.
#   GL032 — the flagged echo/printf writes registry API tokens to npm/NuGet config, not
#           SSH private keys; the rule description does not apply.
ci-config-lint:
  stage: validate
  extends: .runs-on-ci
  # amd64-pinned: the job downloads the linux_amd64 glsec binary, which would
  # fail with an exec-format error on an arm64 runner.
  tags: [amd64]
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache curl tar
    - !reference [.gitlab-api-base, script]
    - | # glsec:ignore GL004 -- JOB-TOKEN rides only the $API_BASE fetch; the github.com fallback is a separate curl with no header
      set -eu
      TARBALL="glsec_${GLSEC_VERSION}_linux_amd64.tar.gz"
      # Prefer this project's generic package registry: it lives on the GitLab host
      # every job already clones from, so it adds no egress dependency the pipeline
      # does not already have. github.com is the fallback for a version that has not
      # been mirrored yet — reaching it from a runner is the single public-internet
      # dependency in the validate stage, and it is where the observed connect
      # timeouts occur. Whichever source answers, the pinned digest below is the
      # gate: a wrong or tampered artifact from either fails closed.
      #
      # The two fetches are written out separately, and share no helper, so the
      # JOB-TOKEN header cannot reach the upstream call: the mirror fetch carries
      # the token and never redirects off-host (--proto-redir, no cross-host auth),
      # while the upstream fetch follows redirects and sends no credentials at all.
      CURL_NET="--connect-timeout 15 --max-time 120 --retry 3 --retry-delay 5 --retry-all-errors"
      GLSEC_MIRROR="${API_BASE}/projects/${CI_PROJECT_ID}/packages/generic/glsec/${GLSEC_VERSION}/${TARBALL}"
      # No --fail on the mirror fetch: a 404 is the expected "this version is not
      # mirrored yet" answer, and --fail would recast it as an error that
      # --retry-all-errors then retries three times before the fallback runs.
      # Branch on the status code instead — curl exits 0 on 4xx, so the code is
      # the only reliable signal. Transient faults (DNS, connect, 5xx) still retry.
      code=$(curl -sS $CURL_NET --proto-redir =https -w '%{http_code}' \
               --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$GLSEC_MIRROR" -o /tmp/glsec.tar.gz || echo 000)
      if [ "$code" = "200" ]; then
        echo "glsec ${GLSEC_VERSION} from the project package registry"
      else
        echo "package registry miss (HTTP ${code}) — falling back to upstream" >&2
        curl -sSL --fail $CURL_NET \
          "https://github.com/glsec/glsec/releases/download/v${GLSEC_VERSION}/${TARBALL}" \
          -o /tmp/glsec.tar.gz
      fi
      echo "${GLSEC_SHA256}  /tmp/glsec.tar.gz" | sha256sum -c
      tar -xzf /tmp/glsec.tar.gz -C /usr/local/bin glsec
      chmod +x /usr/local/bin/glsec
      # GL026 (mutable git-clone ref) is skipped: the integration-external job
      # intentionally tracks the dependably-integration-tests branch head
      # (INTEGRATION_TESTS_REF, default main) rather than pinning a commit SHA, so
      # the suite is verified continuously. It is the only git clone in this file.
      glsec --strict --skip GL022,GL024,GL026,GL032 .gitlab-ci.yml

# Publishes the pinned glsec release into this project's generic package registry,
# so ci-config-lint fetches it from the GitLab host every job already clones from
# instead of reaching github.com on the critical path. Reaching github.com is what
# this job absorbs: it runs post-merge only, off the gating path, and a failure
# here leaves ci-config-lint on its upstream fallback rather than blocking anyone.
# No-ops once the version is present, so it costs a single HEAD on most pipelines.
# GIT_STRATEGY: none — it needs no working tree, only the two pinned variables.
mirror-glsec:
  stage: validate
  extends: .runs-on-ci-main
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  tags: [amd64]
  # Publishes a package version; cancellation must not race a partial upload.
  interruptible: false
  variables:
    GIT_STRATEGY: none
  allow_failure: true
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache curl
    - !reference [.gitlab-api-base, script]
    - | # glsec:ignore GL004 -- JOB-TOKEN rides only the two $API_BASE calls; the github.com download is a separate curl with no header
      set -eu
      TARBALL="glsec_${GLSEC_VERSION}_linux_amd64.tar.gz"
      PKG="${API_BASE}/projects/${CI_PROJECT_ID}/packages/generic/glsec/${GLSEC_VERSION}/${TARBALL}"
      CURL_NET="--connect-timeout 15 --max-time 300 --retry 3 --retry-delay 5 --retry-all-errors"
      # Same split as ci-config-lint: the credentialled calls address $API_BASE
      # and never follow a cross-host redirect; the upstream download follows
      # redirects and sends no header.
      #
      # The existence probe deliberately omits --fail. A 404 is the answer this
      # probe exists to get, not a fault; with --fail it becomes an error that
      # --retry-all-errors retries three times, costing ~15s on every first
      # mirror of a new version. --fail stays on the download and the upload,
      # where a non-2xx genuinely is a failure.
      code=$(curl -sS $CURL_NET --proto-redir =https -o /dev/null -w '%{http_code}' \
               --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$PKG" || echo 000)
      if [ "$code" = "200" ]; then
        echo "glsec ${GLSEC_VERSION} already mirrored — nothing to do."
        exit 0
      fi
      echo "Mirroring glsec ${GLSEC_VERSION} from upstream (probe returned HTTP ${code})"
      curl -sSL --fail $CURL_NET \
        "https://github.com/glsec/glsec/releases/download/v${GLSEC_VERSION}/${TARBALL}" \
        -o /tmp/glsec.tar.gz
      # Verify BEFORE publishing: the mirrored copy must be byte-identical to the
      # digest ci-config-lint enforces, or the mirror becomes a way to feed the
      # gate an artifact it would otherwise reject.
      echo "${GLSEC_SHA256}  /tmp/glsec.tar.gz" | sha256sum -c
      curl -sS --fail $CURL_NET --proto-redir =https --upload-file /tmp/glsec.tar.gz \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$PKG"
      echo "Published glsec ${GLSEC_VERSION} to the project package registry."

# Lockfile/source hygiene gate, both ecosystems.
#
# npm: fails MRs that leak the private dependably registry into web/package-lock.json.
# Happens when a dev's ~/.npmrc points npm at the private proxy and `npm install`
# writes those URLs as `resolved`. Catches pre-mirror — GitHub runners have no
# auth for the private host and would fail `npm ci` after the merge.
#
# NuGet: packages.lock.json records versions and content hashes but no source URL, so
# there is no per-package host to grep. The two checkable invariants are instead
# (a) every project in the solution ships a committed lock file — otherwise the
# locked-mode restores silently degrade to unpinned resolution for that project — and
# (b) the committed nuget.config names only public or `.dependably`-allowlisted
# hosts, which is the allowlist the pre-commit `Dependably.NuCheck` applies and
# which nothing else in CI enforces.
lockfile-registry-guard:
  stage: validate
  extends: [.runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache grep
    - |
      bad=$(grep -nE '"resolved":[[:space:]]*"https?://[^"]+"' web/package-lock.json \
            | grep -v 'registry.npmjs.org/' || true)
      if [ -n "$bad" ]; then
        echo "Non-public npm registry in web/package-lock.json:" >&2
        echo "$bad" >&2
        echo "Re-resolve those packages against https://registry.npmjs.org/ before committing." >&2
        exit 1
      fi
    - |
      # (a) Every solution project must carry a committed packages.lock.json.
      rc=0
      for proj in $(grep -oE '"[^"]*\.csproj"' Dependably.sln | tr -d '"' | tr '\\' '/'); do
        lock="$(dirname "$proj")/packages.lock.json"
        if [ ! -f "$lock" ]; then
          echo "ERROR: $proj has no committed $lock — its restore would resolve unpinned." >&2
          rc=1
        fi
      done
      # (b) Every packageSource host in the committed nuget.config must be public or
      # allowlisted in .dependably. Hosts are compared literally, not by suffix,
      # so `evil-api.nuget.org.example` cannot pass as `api.nuget.org`.
      ALLOWED="api.nuget.org
      $(grep -oE '"[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}"' .dependably | tr -d '"')"
      for host in $(grep -oE '<add key="[^"]+" value="https?://[^"/]+' nuget.config \
                    | sed -E 's|.*https?://||'); do
        if ! printf '%s\n' "$ALLOWED" | tr -d ' ' | grep -qxF "$host"; then
          echo "ERROR: nuget.config packageSource host '$host' is neither public nor allowlisted in .dependably." >&2
          rc=1
        fi
      done
      [ "$rc" -eq 0 ] || exit 1
      echo "lockfile-registry-guard: npm lockfile clean; NuGet lock files present; nuget.config sources allowlisted."

# Fails the pipeline early when the private registry isn't actually in effect, so a
# misconfigured pipeline can't silently restore from public registries. Not release-gating
# (absent from release-gate.needs): .private-registry-setup already hard-fails every restore
# job without the vars, so a green release implies the private feed was used — this is the
# fast, explicit signal. Inline rules mirror .runs-on-ci but exclude fork MRs, which
# legitimately lack the unprotected project vars (so they aren't failed for it).
private-registry-guard:
  stage: validate
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - *release-tag-rule
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache curl
    - | # glsec:ignore GL020 -- curl uses -o /dev/null (connectivity check only); no file is downloaded for execution
      if [ -z "${REGISTRY_URL:-}" ] || [ -z "${REGISTRY_KEY:-}" ]; then
        echo "ERROR: REGISTRY_URL/REGISTRY_KEY are empty on an internal pipeline." >&2
        echo "Restores would fall back to public registries. Set both project CI/CD variables." >&2
        exit 1
      fi
      base="${REGISTRY_URL%/}"
      # NuGet v3 service index — authenticated GET should return 200 on a healthy private feed.
      code=$(curl -sSL -o /dev/null -w '%{http_code}' -u "ci:$REGISTRY_KEY" "$base/nuget/v3/index.json" || echo 000)
      if [ "$code" != "200" ]; then
        echo "ERROR: NuGet service index $base/nuget/v3/index.json returned HTTP $code (expected 200)." >&2
        exit 1
      fi
      # npm endpoint — prove reachability + that the token isn't rejected. A healthy proxy may
      # answer the bare root with 200/3xx/404; only an unreachable host or a 401/403 is fatal.
      code=$(curl -sSL -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $REGISTRY_KEY" "$base/npm/" || echo 000)
      case "$code" in
        000)     echo "ERROR: npm endpoint $base/npm/ unreachable (curl failed)." >&2; exit 1 ;;
        401|403) echo "ERROR: npm endpoint $base/npm/ rejected the CI token (HTTP $code)." >&2; exit 1 ;;
        *)       echo "npm endpoint reachable (HTTP $code), token accepted." ;;
      esac
      echo "private-registry-guard: $base reachable; NuGet index 200, npm token accepted."

# === build ===

build-web:
  stage: build
  # Not in .release-required: gated transitively via `build`'s `needs:`.
  extends: [.private-registry-setup, .runs-on-ci]
  image: ${DEP_IMAGE_REGISTRY}/library/node:26-slim@sha256:ffc78385a788964bb3cbab5e434ff79a10bdc25b8ae6db03fe5fe6cb14053c09
  script:
    - npm install -g npm@12.0.1
    - cd web && npm ci && npm run build
  artifacts:
    paths:
      - src/Dependably.Management/wwwroot/
    expire_in: 1 hour

build:
  stage: build
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  needs: [build-web]
  # Heavy job + produces the linux-x64 artifact consumed by e2e/zap. Pin to amd64
  # runners so the publish happens natively (faster, and avoids qemu surprises).
  tags: [amd64]
  script:
    # Lock-file gate, ahead of the publish. A `-r <rid>` restore cannot run in locked mode
    # (NuGet requires the lock file's runtime-identifier set to equal the project's, so a
    # RID restore against a RID-less lock file fails NU1004), which leaves the publish
    # below resolving its graph unpinned. This RID-less locked restore resolves the same
    # graph from the same feed first: it fails on a version the committed
    # packages.lock.json does not pin (NU1004) or on package bytes whose content hash does
    # not match it (NU1403), and the publish then reuses those verified packages out of the
    # global packages folder. Explicit -p:RestoreLockedMode rather than relying on the
    # CI-conditioned default in Directory.Build.props, so the gate is visible here.
    - dotnet restore src/Dependably -p:RestoreLockedMode=true
    # PublishSingleFile=true (set in csproj) requires a RID and emits to bin/Release/net10.0/<rid>/publish/.
    # Pin linux-x64 so the artifact path and the e2e job's invocation are deterministic. Self-contained
    # is required because csproj enables EnableCompressionInSingleFile, which the SDK rejects otherwise.
    - dotnet publish src/Dependably -c Release -r linux-x64 --self-contained true
  artifacts:
    paths:
      - src/Dependably/bin/Release/net10.0/linux-x64/publish/
    expire_in: 1 hour

# Builds the prebaked ci-tools image under ci/docker/ — jq + a JRE
# + a Node runtime on top of the .NET SDK, consumed by sca-backend (jq for
# parsing `dotnet list package --vulnerable` output) and sonarqube-check (the
# JRE the SonarScanner engine needs, plus Node for its JS analysis sensors).
# Runs whenever a Dockerfile under ci/docker/ changes, on both MR and main
# pipelines — but the PUSH happens only from `main`.
#
# `ci/ci-tools:latest` is a mutable tag that later pipelines execute: sca-backend
# (a release gate) and sonarqube-check (which holds SONAR_TOKEN and the full
# source tree) both run ON this image. A build from an unmerged branch must
# therefore never be allowed to overwrite it — otherwise an MR that is opened,
# fires this job, and is then closed unmerged leaves a persistent foothold in the
# release path with no trace in main's history. The MR run is a build-only
# validation that the Dockerfile still builds; only a main build publishes, which
# keeps the tag tracking source that is genuinely checked in. The gate is enforced
# twice over: by the `rules:` below, and by the ref check in the script (so the
# `build-ci-tools-manual` variant, which replaces `rules:`, inherits it).
#
# Modeled on publish-image's dind/login mechanics. Hard-fails on an
# empty DEP_IMAGE_REGISTRY rather than silently building without a push
# target. Deliberately has NO manual fallback rule: sonarqube-check's `needs:
# [{job: build-ci-tools, optional: true}]` only skips waiting on this job when
# it is genuinely absent from the pipeline — a present-but-unplayed manual job
# still blocks a needs edge, which left sonarqube-check permanently "skipped"
# on every push that didn't touch ci/docker/**. Manual rebuilds (e.g. to pick
# up a base-image digest bump with no source change) use the separate
# build-ci-tools-manual job below, which no needs edge references.
build-ci-tools:
  stage: build
  # Pushes the shared ci/ci-tools:latest tag on main; cancellation must not race
  # a partial push.
  interruptible: false
  image: ${DEP_IMAGE_REGISTRY}/library/docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  services:
    - name: ${DEP_IMAGE_REGISTRY}/library/docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce   # glsec:ignore GL054 -- buildx needs BuildKit; privileged/BuildKit runner is the documented, chosen prerequisite
      alias: docker
  tags: [amd64]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/docker/**
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ci/docker/**
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: "" # glsec:ignore GL031 -- TLS on 2376 needs the runner to share dind's /certs/client volume into the job, which these self-hosted runners do not; the docker executor isolates the dind daemon on this job's per-build service network, so 2375 is not reachable by other jobs
  script:
    - |
      if [ -z "${DEP_IMAGE_REGISTRY:-}" ]; then
        echo "ERROR: DEP_IMAGE_REGISTRY is empty — refusing to build and push CI tool images nowhere." >&2
        exit 1
      fi
    # Read-scoped login: the build below pulls its base layers through the mirror.
    - echo "$REGISTRY_KEY" | docker login "$DEP_IMAGE_REGISTRY" -u api --password-stdin
    # The dind service daemon comes up a few seconds after the job container; wait
    # for it to accept connections before the first command that talks to it.
    - |
      for i in $(seq 30); do docker info >/dev/null 2>&1 && break; echo "waiting for dind ($i)..."; sleep 1; done
      docker info >/dev/null 2>&1 || { echo "dind daemon did not become ready on $DOCKER_HOST"; exit 1; }
    - docker build -f ci/docker/ci-tools.Dockerfile --build-arg DEP_IMAGE_REGISTRY="$DEP_IMAGE_REGISTRY" -t "$DEP_IMAGE_REGISTRY/ci/ci-tools:latest" .
    - |
      # Ref gate. CI_COMMIT_BRANCH is unset on merge-request and tag pipelines, so
      # only a push pipeline on the protected default branch reaches the push. The
      # publish credential is re-logged-in here (see .private-registry-setup for the
      # read/publish split) so the write-capable token is used for the write only.
      if [ "${CI_COMMIT_BRANCH:-}" != "main" ]; then
        echo "Ref '${CI_COMMIT_REF_NAME:-unknown}' is not main: ci-tools image build validated, shared tag NOT overwritten."
      else
        echo "${REGISTRY_PUBLISH_KEY:-$REGISTRY_KEY}" | docker login "$DEP_IMAGE_REGISTRY" -u api --password-stdin
        docker push "$DEP_IMAGE_REGISTRY/ci/ci-tools:latest"
      fi

# Manual-only convenience rebuild of the same image with no ci/docker/** change
# (e.g. a base-image digest bump). Not referenced by any `needs:` edge, so it
# can sit unplayed indefinitely without blocking a downstream DAG job the way
# build-ci-tools' manual fallback would block sonarqube-check. Scoped to main:
# a rule with no `if:` offers the job as a manual play on every MR and tag
# pipeline, which would hand an unmerged branch a second, entirely unrestricted
# route to overwrite the shared ci-tools tag.
build-ci-tools-manual:
  extends: build-ci-tools
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

# === test ===

lint:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/library/node:26-slim@sha256:ffc78385a788964bb3cbab5e434ff79a10bdc25b8ae6db03fe5fe6cb14053c09
  script:
    - npm install -g npm@12.0.1
    - cd web && npm ci && npm run lint && npm run lint:css && npm run check

# C# style/whitespace gate. `dotnet format --verify-no-changes` fails (non-zero) when any
# file deviates from the .editorconfig rules, so an unformatted commit blocks the MR instead
# of drifting in. Both subcommands are run explicitly (matching the local pre-commit hook):
# whitespace is syntactic; style runs the IDExxxx code-style analyzers against the .editorconfig.
dotnet-format:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  tags: [amd64]
  script:
    - dotnet format whitespace --verify-no-changes
    - dotnet format style --verify-no-changes

csp-inline-style-guard:
  stage: test
  extends: [.runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache grep
    - |
      if grep -rn 'style="' web/src --include='*.svelte'; then
        echo "Inline style=\"…\" attributes are forbidden — they violate the SPA's CSP style-src directive. Use CSS classes instead." >&2
        exit 1
      fi

# Bans string interpolation into a Dapper Execute*/Query* call (SQL-injection vector). The
# canonical gate is NoInterpolatedSqlComplianceTests in the unit suite; this grep runs in the
# validate stage so the pattern is caught before the (slower) test job, and mirrors the same
# guard the GitHub mirror runs from the one shared ci/check-sql-interp.sh script. Both honour
# the `// rawsql: <reason>` opt-out so neither is stricter than the compliance test.
sql-interp-guard:
  stage: test
  extends: [.runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache grep
    - sh ci/check-sql-interp.sh src

# Locale completeness gate: every key in the source locale (web en.json, backend
# SharedResource.resx) must exist in every translated locale. Missing keys fail;
# orphaned keys warn. Pure node script — no npm install or registry access needed.
i18n-validate:
  stage: test
  extends: [.runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/library/node:26-slim@sha256:ffc78385a788964bb3cbab5e434ff79a10bdc25b8ae6db03fe5fe6cb14053c09
  script:
    - node i18n/scripts/i18n-validate.js

# Full-history, all-detectors sweep over the entire repository: no --since-commit
# (every commit), no --only-verified (unverified findings count too). Completes in
# seconds even across full history, so it gates every MR and the release as the
# single secret signal — an incremental verified-only pass would only ever be a
# subset of this. A known false positive is silenced via .trufflehog-exclude;
# any real finding fails the pipeline.
secret-scan:
  stage: test
  extends: [.runs-on-ci-or-schedule, .release-required]
  image:
    name: ${DEP_IMAGE_REGISTRY}/trufflesecurity/trufflehog:3.95.3@sha256:9cc33bb080cac0efbbf228a17667172875b529eeeab01efcc4697adfb55f568a
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  script:
    - trufflehog git file://. --exclude-paths=.trufflehog-exclude --fail

unit-tests:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  tags: [amd64]
  script:
    # No --collect:"XPlat Code Coverage" here on purpose. The coverage it would produce is
    # unused: sonarqube-check re-runs the suite with its own collector. Keeping this job to
    # plain test + junit so it finishes fast.
    # JunitXml.TestLogger resolves a relative LogFilePath against the test project
    # directory, which would land the file at tests/Dependably.Tests/test-results/…
    # — outside the artifact path below, so GitLab's Tests tab stays empty. Pin to
    # $CI_PROJECT_DIR so the file lands where artifacts:reports:junit looks.
    - dotnet test --filter "Category!=Integration&Category!=ApiContract&Category!=Schema&Category!=SchemaPostgres" --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/unit.xml"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/unit.xml

api-contract:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  tags: [amd64]
  script:
    - dotnet test --filter "Category=ApiContract" --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/contract.xml"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/contract.xml

integration-tests:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  tags: [amd64]
  script:
    - dotnet test --filter "Category=Integration" --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/integration.xml"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/integration.xml

# Schema/migration guard. Two test categories, both gating:
#   Category=Schema         — applies the full schema to a fresh SQLite DB and asserts structural
#                             soundness + idempotent replay (SchemaIntegrityTests), and statically
#                             checks additive-migration sync, NOT NULL-without-DEFAULT,
#                             SQLite↔Postgres source parity, and backward compatibility with the
#                             previous release tag (Schema*ComplianceTests). The backward-compat
#                             gate reads the previous release's schema out of git; it fetches that
#                             tag explicitly, so the runner's shallow checkout is enough.
#   Category=SchemaPostgres — applies Schema.pg.sql + migrations against the live postgres service
#                             below via NpgsqlMetadataStore (PostgresSchemaApplyTests), proving the
#                             Postgres path boots, is idempotent, and matches the SQLite shape.
# Both excluded from unit-tests so this job is the single schema signal. TEST_POSTGRES_CONNECTION
# points at the service (alias `postgres`); the database is disposable (each test resets `public`).
schema-integrity:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  tags: [amd64]
  services:
    - name: ${DEP_IMAGE_REGISTRY}/library/postgres:18-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa
      alias: postgres
  variables:
    POSTGRES_DB: dependably_test
    POSTGRES_USER: dependably
    POSTGRES_PASSWORD: dependably_test_pw
    TEST_POSTGRES_CONNECTION: "Host=postgres;Port=5432;Database=dependably_test;Username=dependably;Password=dependably_test_pw"
    # A repository with release tags whose baseline schema cannot be read is a broken signal, not a
    # pass: fail the job instead of letting the blue-green gate quietly stop comparing anything.
    SCHEMA_BACKCOMPAT_REQUIRE_BASELINE: "true"
  script:
    - dotnet test --filter "Category=Schema|Category=SchemaPostgres" --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/schema.xml"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/schema.xml

frontend-tests:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/library/node:26-slim@sha256:ffc78385a788964bb3cbab5e434ff79a10bdc25b8ae6db03fe5fe6cb14053c09
  script:
    - cd web
    - npm install -g npm@12.0.1
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/coverage/
    reports:
      junit: web/test-results/junit.xml

# SCA vulnerability gate for NuGet dependencies. `dotnet list package --vulnerable` has two
# independent needs: it restores packages (potentially gigabytes across the full transitive
# graph) through <packageSources>, and it looks up advisory data through <auditSources>. Only
# the latter genuinely needs to be public — NuGet advisory data lives solely on nuget.org and
# Dependably does not serve it. Packages restore through the private dogfood feed like every
# other job (`.private-registry-setup`); `NUGET_AUDIT_SOURCE` opts this job in to an
# <auditSources> entry naming nuget.org, alongside — not instead of — the private
# <packageSources>.
sca-backend:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci-or-schedule, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/ci/ci-tools:latest   # glsec:ignore GL001 -- project-owned image: build-ci-tools publishes this tag only from a `main` push, so it always tracks the checked-in ci/docker/ci-tools.Dockerfile (whose base IS digest-pinned) and no unmerged branch can overwrite it; a digest pin here would go stale on every rebuild
  tags: [amd64]
  variables:
    NUGET_AUDIT_SOURCE: https://api.nuget.org/v3/index.json
  script:
    - dotnet restore
    - dotnet list package --vulnerable --include-transitive --format json > sca-backend.json
    - |
      cat sca-backend.json
      # Coverage guard: `dotnet list package --vulnerable` degrades silently — with no live
      # auditSources it exits 0 and emits a `projects[]` entry carrying no `frameworks` key at
      # all (rather than an empty one), so the BAD extraction below sees zero matches whether
      # nothing was vulnerable or nothing was scanned. Refuse to trust the result unless at
      # least one project actually got audited.
      COVERAGE=$(jq '[.projects[]? | select(has("frameworks"))] | length' sca-backend.json)
      if [ "$COVERAGE" -eq 0 ]; then
        echo "ERROR: advisory coverage was inactive — no project in sca-backend.json carries a 'frameworks' key, the shape dotnet emits when NUGET_AUDIT_SOURCE didn't reach a live audit source. This run scanned nothing; it is not a clean result." >&2
        exit 1
      fi
      BAD=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select(.vulnerabilities != null) | .vulnerabilities[] | select(.severity == "High" or .severity == "Critical")] | length' sca-backend.json)
      if [ "$BAD" -gt 0 ]; then
        echo "ERROR: $BAD High/Critical vulnerable NuGet package reference(s) — see sca-backend.json above." >&2
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths: [sca-backend.json]

# SCA vulnerability gate for npm dependencies. Uses the public npm audit advisory endpoint
# (--registry flag) for vulnerability data — the private proxy does not implement
# the /-/npm/v1/security/advisories/bulk endpoint that npm audit requires.
sca-frontend:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci-or-schedule, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/library/node:26-slim@sha256:ffc78385a788964bb3cbab5e434ff79a10bdc25b8ae6db03fe5fe6cb14053c09
  script:
    - cd web
    - npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

# Dockerfile style/hygiene gate. Not release-required — lint issues are advisory
# until the operator chooses to enforce them. DL3018 (pin apk versions) is
# intentionally ignored: the runtime base is already digest-pinned, so the
# package version granularity adds no supply-chain value at build time.
docker-lint:
  stage: test
  extends: .runs-on-ci
  image:
    name: ${DEP_IMAGE_REGISTRY}/hadolint/hadolint:latest-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
    entrypoint: [""]
  script:
    - hadolint Dockerfile
    - hadolint Dockerfile.edge
    - hadolint ci/docker/ci-tools.Dockerfile

# Machine-checkable exclusion proof for the edge image. The dependably/edge closure
# must never contain the management-plane packages (SAML/IdentityModel/JWT stack,
# Redis pair, BCrypt, zxcvbn, OpenApi). This job generates the edge CycloneDX SBOM
# and fails the MR if any forbidden family appears — closing-the-loop on every MR,
# which is where a stray reference would poison the closure. BLOCKING (no
# allow_failure): the guard is the per-MR gate that keeps the closure clean. Not
# release-required — it gates MRs, and required-set membership is explicit
# (release-contract-lint reconciles .release-required against release-gate.needs).
edge-closure-guard:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci]
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  script:
    - dotnet tool restore
    # CycloneDX's own internal restore carries a fixed 5-minute cap and
    # re-resolves the whole graph from scratch, which intermittently times out
    # against the private mirror. Restore explicitly first (no internal cap)
    # and pass --disable-package-restore so CycloneDX reads the
    # project.assets.json this restore already produced instead of re-running
    # its own restore.
    - dotnet restore src/Dependably.Edge/Dependably.Edge.csproj
    - dotnet CycloneDX src/Dependably.Edge/Dependably.Edge.csproj -o . -fn sbom-edge.json -F json -spv 1.6 --exclude-dev --disable-package-restore
    - ci/edge-closure-guard.sh sbom-edge.json
  artifacts:
    paths:
      - sbom-edge.json
    expire_in: 30 days

e2e:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
  needs: [build]
  # Playwright image is amd64-only; on Pi runners it ran under qemu and the slow
  # emulation caused intermittent timing flakes. Pin to native amd64.
  tags: [amd64]
  script:
    - cd web
    - npm install -g npm@12.0.1
    - npm ci
    - npm run e2e -- --project=chromium
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/playwright-report/
      - web/test-results/
    reports:
      junit: web/test-results/junit.xml

# Signal-only — not in release-gate.needs. allow_failure: true is intentional;
# scan results inform Sonar dashboards but don't gate the release.
#
# Main + tag only. SonarQube Community Edition rejects sonar.pullrequest.*
# ("Developer Edition or above is required"), so running on merge_request_event
# either fails (with the PR-decoration args) or pollutes the main branch's
# analysis (without them, the feature-branch source gets stored against the
# project's default branch). Until the server is upgraded, MR coverage is out
# of reach; rather than ship noise, scope sonar to post-merge.
sonarqube-check:
  stage: test
  extends: [.private-registry-setup, .runs-on-ci-main]
  image: ${DEP_IMAGE_REGISTRY}/ci/ci-tools:latest   # glsec:ignore GL001 -- project-owned image: build-ci-tools publishes this tag only from a `main` push, so it always tracks the checked-in ci/docker/ci-tools.Dockerfile (whose base IS digest-pinned) and no unmerged branch can overwrite it; a digest pin here would go stale on every rebuild
  # needs bypasses stage ordering, so the ci-tools image build (present only in
  # pipelines where ci/docker/** changed) must be an explicit optional edge —
  # otherwise this job can start before the image it pulls has been pushed.
  needs: [frontend-tests, { job: build-ci-tools, optional: true }]
  tags: [amd64]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    # Pinned: an unpinned global tool install resolves whatever the feed currently serves as
    # latest and then executes it in a job holding SONAR_TOKEN and the full source tree.
    # Bump deliberately, alongside a SonarQube server-compatibility check.
    - dotnet tool install --global dotnet-sonarscanner --version 11.2.1
    - export PATH="$PATH:$HOME/.dotnet/tools"
    # The token is passed explicitly via /d:sonar.token — the SONAR_TOKEN environment
    # variable alone is NOT honored by the scanner's begin step against this SonarQube
    # 9.9 server (pre-processing fails with "Authentication with the server has failed").
    # This is safe for the job trace: GitLab echoes script lines unexpanded (the literal
    # text $SONAR_TOKEN), so the value never appears in the log regardless of variable
    # masking. SONAR_TOKEN must still be a masked CI/CD variable (see CONTRIBUTING >
    # SonarQube (CI)).
    # SonarQube 9.9 LTS's C# plugin v8.51 does NOT trigger the "C# Tests Coverage Report
    # Import" sensor on `sonar.cs.cobertura.reportsPaths` in this stack — last scan log
    # showed the cobertura file present + path-correct + the property set, yet the sensor
    # never ran and "Zero Coverage Sensor" stamped every file at 0/N. OpenCover is the
    # historically-preferred C# format for SonarQube and the sensor for it (sonar.cs.
    # opencover.reportsPaths) is rock-solid. ReportGenerator converts cobertura → OpenCover.
    - >
      dotnet sonarscanner begin
      /k:"$SONAR_PROJECT_KEY"
      /d:sonar.token="$SONAR_TOKEN"
      /d:sonar.host.url="$SONAR_HOST_URL"
      /d:sonar.cs.opencover.reportsPaths="test-results/opencover.xml"
      /d:sonar.cs.vstest.reportsPaths="test-results/tests.trx"
      /d:sonar.javascript.lcov.reportPaths="web/coverage/lcov.info"
      /d:sonar.coverage.exclusions="src/**/Program.cs,src/**/schema/Schema*.sql,src/**/Infrastructure/Redis/**/*.cs,src/**/Infrastructure/RedisLockoutStore.cs,src/**/Infrastructure/NpgsqlMetadataStore.cs,src/**/Storage/AzureBlobContainerAdapter.cs,src/**/Infrastructure/SpdxLicenseRepository.cs,web/src/main.js,web/src/App.svelte,web/src/locales/**,web/.stylelintrc.cjs,web/svelte.config.js,web/vite.config.js,web/vitest.config.js,web/eslint.config.js,build/extract-notices.mjs,i18n/scripts/i18n-validate.js"
      /d:sonar.exclusions="web/e2e/**"
      /d:sonar.test.inclusions="**/*Tests.cs,**/*.test.js,**/*.spec.js,**/*.spec.ts"
      /d:sonar.issue.ignore.multicriteria="e1"
      /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S5332"
      /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/RpmRepodataService.cs"
    - dotnet build
    # Integration tests are included in the coverage collection on purpose: they are
    # self-contained (in-memory blob + SQLite, no external services) and are the only
    # tests that exercise several controller surfaces (webhooks, MFA, trust anchors,
    # quarantine), which otherwise report 0% and drag new-code coverage below the gate.
    # ApiContract (boots the app to diff the live OpenAPI) and SchemaPostgres (needs a
    # live Postgres) stay excluded — neither runs in this job's environment.
    - dotnet test --filter "Category!=ApiContract&Category!=SchemaPostgres" --settings coverlet.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory ./test-results
    # coverlet.collector now emits opencover (per coverlet.runsettings <Format>opencover</Format>)
    # at test-results/<guid>/coverage.opencover.xml. Move to a deterministic path so the
    # scanner config can point at a literal filename.
    - find test-results -name 'coverage.opencover.xml' -exec mv -f {} test-results/opencover.xml \;
    - echo "=== artifacts SonarScanner is about to ingest ==="
    - ls -la test-results/opencover.xml test-results/tests.trx web/coverage/lcov.info
    - echo "--- opencover header ---"
    - head -10 test-results/opencover.xml
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  allow_failure: true

# Boots the real published binary and runs the external dependably-integration-tests suite
# against it. RunOnStartup background jobs are disabled via DISABLE_BACKGROUND_JOBS so the
# runner needs no boot-time egress: vuln-scan/vuln-rescan, deprecation-refresh, and threat-feed
# each make a real outbound HTTP call at boot; license-backfill makes no outbound call but
# mutates the shared cache_artifact.license_checked_at column under a leader lock at boot, its
# own source of run non-determinism, so it is disabled too. ASPNETCORE_ENVIRONMENT is left at
# Production and AIR_GAPPED is NOT set, so request-time proxy passthrough to upstream registries
# remains fully operational. The suite exercises proxy/upstream code paths that need real
# network.
#
# allow_failure: true holds until the external suite is proven green against this job.
# A follow-up will promote it to .release-required and add it to release-gate.needs.
integration-external:
  stage: test
  extends: [.private-registry-setup]
  # Opt-in: stays skipped (not failed) until the dependably-integration-tests repo
  # allowlists this project for CI_JOB_TOKEN (Settings → CI/CD → Job token
  # permissions) and the suite implements the env contract below. Set
  # RUN_EXTERNAL_INTEGRATION=true (project CI/CD variable) to enable; drop
  # allow_failure and promote to .release-required once it is reliably green.
  rules:
    - if: '$RUN_EXTERNAL_INTEGRATION != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - *release-tag-rule
  # Same digest as every other dotnet job, pulled through the private mirror
  # rather than mcr.microsoft.com directly so CI image traffic stays off public registries.
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  needs: [build]
  tags: [amd64]
  allow_failure: true
  variables:
    INTEGRATION_TESTS_REF: "main"
  script:
    # --- inline app boot (mirrors .zap_app_boot but with background jobs disabled) ---
    # AIR_GAPPED is intentionally NOT set so proxy passthrough remains live.
    - mkdir -p /tmp/ext-int/blobs
    - export DB_PATH=/tmp/ext-int/dependably.db
    - export LOCAL_STORAGE_PATH=/tmp/ext-int/blobs
    - export STORAGE_BACKEND=local
    - export ASPNETCORE_URLS=http://+:8080
    - export FIRST_BOOT_ADMIN_PASSWORD="$DAST_ADMIN_PASSWORD"
    - export LOGIN_RATE_LIMIT_PERMITS=100000
    - export TOKEN_CREATE_RATE_LIMIT_PERMITS=100000
    # Disable the RunOnStartup services that mutate state at boot: OsvVulnScanService,
    # DeprecationRefreshService, and ThreatFeedService each make a real outbound HTTP call;
    # LicenseBackfillService makes no outbound call but mutates the shared cache plane under a
    # leader lock at boot, its own source of run non-determinism. Proxy request-time passthrough
    # to upstream registries is unaffected. OSV stays in default remote mode (never invoked —
    # vuln-scan is disabled), so no OSV_LOCAL_PATH is required; AIR_GAPPED/OSV_MODE=local would
    # crash the boot.
    - export DISABLE_BACKGROUND_JOBS=vuln-scan,vuln-rescan,deprecation-refresh,threat-feed,license-backfill
    - cp -r src/Dependably/bin/Release/net10.0/linux-x64/publish /tmp/ext-int/app
    - chmod +x /tmp/ext-int/app/Dependably
    - /tmp/ext-int/app/Dependably > /tmp/ext-int/app.log 2>&1 &
    - APP_PID=$!
    - |
      for i in $(seq 1 60); do
        if curl -fsS http://localhost:8080/ready > /dev/null 2>&1; then
          echo "App ready after ${i}s"
          break
        fi
        if ! kill -0 "$APP_PID" 2>/dev/null; then
          echo "App died during startup — log follows:" >&2
          cat /tmp/ext-int/app.log >&2
          exit 1
        fi
        sleep 1
      done
      curl -fsS http://localhost:8080/ready || { echo "App not ready after 60s — log follows:" >&2; cat /tmp/ext-int/app.log >&2; exit 1; }
    # --- clone and run the external suite ---
    - export DEPENDABLY_BASE_URL=http://localhost:8080
    - export DEPENDABLY_ADMIN_EMAIL=admin@dependably.local
    - export DEPENDABLY_ADMIN_PASSWORD="$DAST_ADMIN_PASSWORD"
    # Clone the external suite from this project's own self-hosted GitLab. The
    # CI_JOB_TOKEN is sent as an Authorization header rather than embedded in the
    # remote URL, so it never lands in .git/config. The header is handed to git via
    # GIT_CONFIG_COUNT/KEY/VALUE rather than `git -c …`: /proc/<pid>/cmdline is
    # world-readable on the runner host, /proc/<pid>/environ is not, so the env-var
    # form keeps the credential out of the process argv as well.
    - | # glsec:ignore GL004 -- gitlab.northwardlabs.ca is this project's own self-hosted GitLab; CI_JOB_TOKEN is a first-party credential
      AUTH_B64=$(printf 'gitlab-ci-token:%s' "$CI_JOB_TOKEN" | base64 | tr -d '\n')
      GIT_CONFIG_COUNT=1 \
      GIT_CONFIG_KEY_0=http.extraHeader \
      GIT_CONFIG_VALUE_0="Authorization: Basic ${AUTH_B64}" \
      git clone --depth 1 --branch "$INTEGRATION_TESTS_REF" "https://gitlab.northwardlabs.ca/moonlitlabs/dependably-integration-tests.git" /tmp/integration-tests
    # .private-registry-setup writes nuget.config to $CI_PROJECT_DIR (not $HOME), so
    # dotnet restore inside the cloned suite — running from /tmp/integration-tests —
    # would fall back to public nuget.org. Copy the generated config into the clone
    # directory so all NuGet restores in the suite target the private feed.
    - cp "$CI_PROJECT_DIR/nuget.config" /tmp/integration-tests/
    - mkdir -p "$CI_PROJECT_DIR/test-results"
    - cd /tmp/integration-tests
    - dotnet test --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/integration-external.xml"
  after_script:
    - echo "=== dependably app log ==="; cat /tmp/ext-int/app.log || true
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/integration-external.xml
    paths:
      - test-results/

# === sbom ===

sbom-backend:
  stage: sbom
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3
  script:
    - dotnet tool restore
    # CycloneDX's own internal restore carries a fixed 5-minute cap and
    # re-resolves the whole graph from scratch, which intermittently times out
    # against the private mirror. Restore explicitly first (no internal cap)
    # and pass --disable-package-restore so CycloneDX reads the
    # project.assets.json this restore already produced instead of re-running
    # its own restore.
    - dotnet restore src/Dependably/Dependably.csproj
    - dotnet CycloneDX src/Dependably/Dependably.csproj -o . -fn sbom-backend.json -F json -spv 1.6 --exclude-dev --disable-package-restore
  artifacts:
    paths:
      - sbom-backend.json
    expire_in: 30 days

sbom-frontend:
  stage: sbom
  extends: [.private-registry-setup, .runs-on-ci, .release-required]
  image: ${DEP_IMAGE_REGISTRY}/library/node:26-slim@sha256:ffc78385a788964bb3cbab5e434ff79a10bdc25b8ae6db03fe5fe6cb14053c09
  script:
    - npm install -g npm@12.0.1
    - cd web && npm ci && npm run sbom
  artifacts:
    paths:
      - web/sbom-frontend.json
    expire_in: 30 days

dt-publish:
  stage: sbom
  extends: [.runs-on-ci-main, .release-required]
  # Uploads SBOMs to Dependency-Track; cancellation must not race a partial
  # publish of the parent/child project set.
  interruptible: false
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  needs:
    - job: sbom-backend
      artifacts: true
    - job: sbom-frontend
      artifacts: true
  variables:
    DT_PARENT_NAME: "Dependably Community"
    DT_VERSION: "latest"
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache curl
    - | # glsec:ignore GL020 -- curl POSTs SBOM files to the DT API; no executable is downloaded
      set -eu
      if [ -z "${dependencyTrack_token:-}" ] || [ -z "${dependencyTrack_url:-}" ]; then
        echo "Dependency-Track not configured (set the dependencyTrack_token and dependencyTrack_url CI/CD variables) — skipping SBOM publish." >&2
        exit 0
      fi
      AUTH="X-Api-Key: $dependencyTrack_token"
      BASE="${dependencyTrack_url%/}"

      status=$(curl -sS -o /tmp/parent.out -w '%{http_code}' \
        -X PUT "$BASE/api/v1/project" \
        -H "$AUTH" -H 'Content-Type: application/json' \
        -d "{\"name\":\"$DT_PARENT_NAME\",\"version\":\"$DT_VERSION\"}")
      case "$status" in
        201|409) echo "Parent ready (HTTP $status)";;
        *) echo "Parent bootstrap failed (HTTP $status):" >&2; cat /tmp/parent.out >&2; exit 1;;
      esac

      upload() {
        child="$1"; file="$2"
        echo "Publishing $child from $file"
        status=$(curl -sS -o /tmp/bom.out -w '%{http_code}' \
          -X POST "$BASE/api/v1/bom" \
          -H "$AUTH" \
          -F "autoCreate=true" \
          -F "projectName=$child" \
          -F "projectVersion=$DT_VERSION" \
          -F "parentName=$DT_PARENT_NAME" \
          -F "parentVersion=$DT_VERSION" \
          -F "bom=@$file")
        case "$status" in
          200) echo "  uploaded";;
          *) echo "  upload failed (HTTP $status):" >&2; cat /tmp/bom.out >&2; exit 1;;
        esac
      }
      upload backend  sbom-backend.json
      upload frontend web/sbom-frontend.json

# === ai-review ===

# Advisory LLM review of the MR diff against a local Ollama instance. Signal-only
# (allow_failure: true), MR-only, and deliberately NOT .release-required —
# non-deterministic model output must never gate a release (mirrors zap-full /
# sonarqube-check). Each concrete job supplies a persona prompt file + a report
# name; all diff/curl/jq/report/comment logic lives in ci/ai-review.sh so the
# jobs don't duplicate it. resource_group serializes the four jobs so a single
# local model isn't hit by four concurrent 30B requests.
.ai-review:
  stage: ai-review
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  # MR-only: the diff and the MR to comment on only exist on a merge_request
  # pipeline. Inline rules are safe here because these jobs do NOT extend
  # .release-required, so release-contract-lint's "no inline rules" guard
  # (which only inspects required jobs) does not apply.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # No `needs:` — run in stage order (after sbom), so the model only reviews an
  # MR whose build/test/sbom already passed instead of racing ahead at t=0.
  resource_group: ai-review
  interruptible: true
  timeout: 20 minutes
  variables:
    # Defaults; override via project CI/CD variables without editing YAML.
    OLLAMA_URL: "http://192.168.2.25:11434" # glsec:ignore GL016 -- Ollama runs on a private LAN address; TLS is not available there
    # 26B MoE (a4b => ~4B active params): same per-call latency as the 12B dense
    # model on this host but stronger review quality. The earlier no-content failure
    # at this size was the reasoning-budget bug now fixed by AI_REVIEW_THINK=false.
    OLLAMA_MODEL: "gemma4:26b-a4b-it-qat"
    GIT_DEPTH: "20"
    AI_REVIEW_MAX_DIFF_BYTES: "120000"
    # Must hold the ~35K-token prompt a 120000-byte diff produces plus generation
    # room; at 16384 the prompt filled the window and the model returned no content.
    AI_REVIEW_NUM_CTX: "49152"
    # gemma4:* is a reasoning model; thinking burns the generation budget before any
    # answer is written. Off => the model writes the review straight to content.
    AI_REVIEW_THINK: "false"
  allow_failure: true
  before_script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache bash curl jq git
  script:
    - bash ci/ai-review.sh "$AI_REVIEW_PERSONA_FILE" "$AI_REVIEW_REPORT_FILE"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - "$AI_REVIEW_REPORT_FILE"

ai-review-security:
  extends: .ai-review
  variables:
    AI_REVIEW_PERSONA_FILE: "ci/prompts/security.md"
    AI_REVIEW_REPORT_FILE: "ai-security-review.md"
    AI_REVIEW_LABEL: "Security"

ai-review-code:
  extends: .ai-review
  variables:
    AI_REVIEW_PERSONA_FILE: "ci/prompts/code.md"
    AI_REVIEW_REPORT_FILE: "ai-code-review.md"
    AI_REVIEW_LABEL: "Code Quality"

ai-review-architecture:
  extends: .ai-review
  variables:
    AI_REVIEW_PERSONA_FILE: "ci/prompts/architecture.md"
    AI_REVIEW_REPORT_FILE: "ai-architecture-review.md"
    AI_REVIEW_LABEL: "Architecture"

ai-review-docs:
  extends: .ai-review
  variables:
    AI_REVIEW_PERSONA_FILE: "ci/prompts/documentation.md"
    AI_REVIEW_REPORT_FILE: "ai-docs-review.md"
    AI_REVIEW_LABEL: "Documentation"

# === dast ===

# Shared app-boot for every DAST job and e2e: copies the published binary, boots
# it on :8080 with a throwaway DB/blob store, and waits on /ready (aborting if
# the process dies). Mirrors the Playwright CI webServer pattern in
# web/e2e/playwright.config.ts: same binary path, same env-var shape, same gate.
# DISABLE_BACKGROUND_JOBS turns off the RunOnStartup refresh services that mutate state on
# every boot: vuln-scan/-rescan, deprecation-refresh (→ npmjs/pypi), and threat-feed
# (→ cisa.gov + first.org) each make a real outbound HTTP call; license-backfill makes no
# outbound call but mutates the shared cache_artifact.license_checked_at column under a leader
# lock at boot, its own source of run non-determinism, so it is disabled too. OSV stays in
# default remote mode but is never invoked, so no OSV_LOCAL_PATH is required.
.app_boot: &app_boot |
  mkdir -p /tmp/dast/blobs
  export DB_PATH=/tmp/dast/dependably.db
  export LOCAL_STORAGE_PATH=/tmp/dast/blobs
  export STORAGE_BACKEND=local
  export ASPNETCORE_URLS=http://+:8080
  export FIRST_BOOT_ADMIN_PASSWORD="$DAST_ADMIN_PASSWORD"
  # DAST determinism: raise every request-rate limiter far above the scan's request
  # volume so ZAP never crosses a 429 boundary. A 429 mid-scan is both a lost probe
  # (coverage gap) and the root cause of ZAP's rate-limiter-gated boolean-SQL [40018]
  # and path-traversal [6] false positives: the limiter flips from allow to block
  # between a rule's true/false probe pair, and ZAP reads that response variance as a
  # confirmed injection on a different parameter each run. With no 429 boundary those
  # rules fire only on genuine differences. The invite limiter needs its own knob
  # (INVITE_RATE_LIMIT_PERMITS) — several management writes (invites, email/Slack
  # config, alert settings) share it and were among the endpoints flaking.
  export LOGIN_RATE_LIMIT_PERMITS=100000
  export TOKEN_CREATE_RATE_LIMIT_PERMITS=100000
  export INVITE_RATE_LIMIT_PERMITS=100000
  export IMPORT_RATE_LIMIT_PERMITS=100000
  export MANAGEMENT_RATE_LIMIT_PERMITS=100000
  export METADATA_RATE_LIMIT_PERMITS=100000
  export ANON_RATE_LIMIT_PERMITS=100000
  export PUSH_RATE_LIMIT_PERMITS=100000
  export DOWNLOAD_RATE_LIMIT_PERMITS=100000
  # The GlobalLimiter's default-deny ceiling for any controller route that declares no explicit
  # policy (protocol registry routes, plus non-/api/v1 management routes like /saml/*). Left at its
  # 300/min default it is the one limiter the scan can still cross — a system-admin ZAP run fuzzing
  # those paths produces a 429 flood that perturbs the active scan into spurious findings. Raise it
  # with the rest so the bounded scan probes unthrottled; a high (not infinite) ceiling still bounds
  # a real DoS on any non-DAST run.
  export PROTOCOL_DEFAULT_RATE_LIMIT_PERMITS=100000
  export DISABLE_BACKGROUND_JOBS=vuln-scan,vuln-rescan,deprecation-refresh,threat-feed,license-backfill
  # DAST log volume: a full active scan drives tens of thousands of probes, each of which
  # UseSerilogRequestLogging records as one request-completion event. At the default
  # Information level that is one ECS-JSON line per probe — the after_script's app-log dump
  # then floods the GitLab job trace past the runner output_limit, which fails the job even
  # though the scan itself passed. Raise the app's floor to Warning so successful probes log
  # nothing; anomalies (slow requests -> Warning, unhandled 500s -> Error, with the stack) still
  # surface, and the complete Information-level log is unaffected on any non-DAST run. This
  # tunes CI log verbosity only — it does not change what the scanner exercises or asserts.
  export Serilog__MinimumLevel__Default=Warning
  cp -r src/Dependably/bin/Release/net10.0/linux-x64/publish /tmp/dast/app
  chmod +x /tmp/dast/app/Dependably
  /tmp/dast/app/Dependably > app.log 2>&1 &
  APP_PID=$!
  for i in $(seq 1 60); do
    if curl -fsS http://localhost:8080/ready > /dev/null 2>&1; then
      echo "App ready after ${i}s"
      break
    fi
    if ! kill -0 "$APP_PID" 2>/dev/null; then
      echo "App died during startup — log follows:" >&2
      cat app.log >&2
      exit 1
    fi
    sleep 1
  done
  curl -fsS http://localhost:8080/ready || { echo "App not ready after 60s — log follows:" >&2; cat app.log >&2; exit 1; }

# Full active attack scan of the unauthenticated surface — gates every MR and the
# release. -I is dropped and accepted noise lives in .zap/full.conf, so a new
# active finding (a real injection/XSS an agent introduces) reds the pipeline and
# blocks the merge. The active scan runs every passive rule too, so it subsumes a
# separate passive baseline over the same spider surface. interruptible so a
# re-push cancels an in-flight scan instead of stacking work on the single amd64
# runner it shares with the other gating jobs.
zap-full:
  stage: dast
  extends: [.runs-on-ci, .release-required]
  image:
    name: ${DEP_IMAGE_REGISTRY}/zaproxy/zap-stable:2.17.0@sha256:2ec1d5d5b44d55cfd02ba9b89cd26852f06d92b7fc0ce9f064b9463babc73074
    entrypoint: [""]
  needs: [build]
  # ZAP image is multi-arch; on a Pi runner Docker pulls the native arm64 variant
  # and the x64 Dependably binary fails with "Exec format error". Pin to amd64
  # runners so the published binary executes natively.
  tags: [amd64]
  interruptible: true
  variables:
    # Firefox's release/ESR channels (this image ships firefox-esr) silently
    # ignore a config override of services.settings.server outside Nightly/tests
    # unless this variable is set — Firefox's own services/settings/Utils.sys.mjs
    # (allowServerURLOverride) checks for it by name; without it,
    # ci/zap-firefox-prefs.sh's services.settings.server override is a no-op and
    # Remote Settings keeps syncing from the real Mozilla server regardless. It
    # also blocks Firefox from making non-local network connections at the
    # network layer, which the AJAX spider's target (http://localhost:8080)
    # never needs — the crawl reaches it entirely through ZAP's own proxy on
    # loopback. Inherited down the daemon → geckodriver → Firefox process chain
    # the same way any other job variable is.
    MOZ_DISABLE_NONLOCAL_CONNECTIONS: "1"
    # Catastrophe floor for the crawl-coverage count ci/zap-full-hooks.py's zap_pre_shutdown
    # hook writes to zap-full-url-count.txt (its own zap.core.urls() tally, taken at the same
    # point zap-full-scan.py would print its own now-unused `Total of N URLs` line). Measured
    # successful runs on this job range 94-806 URLs for the same branch and config — a ~7.5x
    # swing this floor does NOT explain or narrow, and clearing it is NOT a coverage guarantee.
    # It exists only to catch the AJAX spider not effectively running at all: a
    # traditional-spider-only crawl of this app finds roughly 10-20 URLs, so 30 sits above that
    # dead-spider ceiling with margin while staying well below the lowest healthy run on record
    # (94), so a real but thin crawl never reds this blocking gate. Override per-pipeline with a
    # CI/CD variable of the same name if a future measured range needs a different value.
    ZAP_FULL_MIN_URLS: "30"
    # AJAX-spider and active-scan bounds read by ci/zap-full-hooks.py (via os.environ) to keep
    # this job's crawl consistent run to run instead of swinging 106-3577 URLs for the same 0
    # findings. See that file's AJAX_SPIDER_MAX_*/ASCAN_MAX_DURATION_MINS comments for the
    # calibration reasoning — briefly: max_crawl_states sits above every healthy run on record
    # (806) but well below the observed runaway (3577); the two *_MAX_DURATION_MINS values are
    # wall-clock backstops, not normal-case constraints. Override per-pipeline with a CI/CD
    # variable of the same name.
    ZAP_FULL_AJAX_MAX_DURATION_MINS: "15"
    ZAP_FULL_AJAX_MAX_CRAWL_STATES: "1200"
    ZAP_FULL_ASCAN_MAX_MINS: "20"
  script:
    - *app_boot
    # Authenticate the crawl: ci/zap-dast-auth.sh logs in and emits a session cookie
    # that the replacer add-on injects on every request (browser included), so the AJAX
    # spider can crawl the JS-rendered SPA past the login wall instead of stopping at the
    # handful of unauthenticated static URLs a traditional spider finds.
    - sh ci/zap-dast-auth.sh
    - . ./zap-creds.env
    # ZAP scripts hardcode base_dir='/zap/wrk/' for report output, but the image
    # ships without that directory (it's the conventional bind-mount target).
    # Symlink it to $PWD so .zap/*.conf is in place and -J/-r land in the build
    # dir where GitLab picks them up as artifacts.
    - ln -sfn "$PWD" /zap/wrk
    # -j's AJAX spider launches a fresh-profile Firefox headless (the image ships
    # no Chrome/Chromium binary or driver for the selenium add-on to switch to;
    # firefox-headless is confirmed as the daemon's only ajaxSpider browser). A
    # fresh Firefox profile phones home to Mozilla Remote Settings, telemetry, and
    # safebrowsing on every browser context it opens — the same failure mode
    # web/e2e/playwright.config.ts documents and disables for the Firefox e2e
    # project. A 2-hour CI window has moved 12.29 GB to mozilla.com/mozilla.net
    # from this job. ci/zap-firefox-prefs.sh emits -config overrides that seed
    # the daemon's selenium.firefoxPrefs list at startup (the add-on's own
    # per-browser preference store — it exposes no runtime API for this, only
    # browser arguments), the direct equivalent of playwright.config.ts's
    # firefoxUserPrefs — combined with the MOZ_DISABLE_NONLOCAL_CONNECTIONS
    # variable above, which is what makes the Remote Settings server override in
    # that script actually take effect instead of being silently dropped (see
    # that script for why). The one falsifiable, verified prediction: both
    # firefox.settings.services.mozilla.com and
    # firefox-settings-attachments.cdn.mozilla.net go to zero bytes with this
    # applied — reproduced with tcpdump against a throwaway local target, crawl
    # duration long enough to cross Firefox's update-timer first-poll window
    # (UpdateTimerManager.sys.mjs sets it at ≥30s after profile-after-change).
    # The overall byte reduction in that reproduction cannot be generalized to
    # this job's real crawl (different site, different session length, different
    # number of browser contexts) and is not restated here as an expected
    # percentage; the real effect is what CI's own egress accounting measures.
    # Two of the prefs (security.remote_settings.crlite_filters.enabled and
    # .intermediates.enabled) turn off the crawler browser's own real-time
    # certificate-revocation checks. ZAP's proxy does not re-verify upstream
    # certificates on the crawler's behalf (its TLS client uses a
    # trust-everything manager, standard for a testing proxy that needs to
    # intercept any site), so this is not redundant with anything ZAP itself
    # does — it is dropping the only revocation check in the chain. The trade is
    # still sound here because the target is http://localhost:8080: plain HTTP
    # loopback, so there is no certificate for the crawl itself to revoke-check
    # in the first place; the two prefs only stop Firefox's own background
    # requests to Mozilla's infrastructure from performing revocation checks on
    # certs unrelated to this crawl.
    - ZAP_FIREFOX_NO_PHONE_HOME="$(sh ci/zap-firefox-prefs.sh)"
    # -j runs the AJAX (browser) spider to crawl the SPA; the hook excludes the
    # logout/password/MFA endpoints so the authenticated browser crawl does not revoke
    # its own session mid-scan (the same self-logout trap the management API scan avoids), and
    # bounds the spider/active-scan (see ci/zap-full-hooks.py) so the crawl is consistent run to
    # run instead of swinging 106-3577 URLs for the same 0 findings. No -d here: at INFO level
    # (the default) zap-full-scan.py logs progress only at DEBUG, so the job log is quiet
    # between the invocation and the final summary — expected, not a hang — while -d's
    # per-request/per-alert detail was what pushed this job's log volume past GitLab's 4 MB
    # per-job limit and got it silently truncated. The `Total of N URLs` line -d emits is also
    # gated on -d; the coverage floor below does not depend on it — zap_pre_shutdown in the hook
    # file writes that same zap.core.urls() count directly to zap-full-url-count.txt, which the
    # floor reads instead. The scan runs as an `if` condition because POSIX exempts that
    # from `set -e`, which a brace group is not: with `{ cmd; echo $?; }` a failing scan aborts
    # before recording its status, and under `pipefail` the raw exit code escapes the coverage
    # check.
    - |
      { if ZAP_AUTH_HEADER=Cookie ZAP_AUTH_HEADER_VALUE="$ZAP_SESSION_COOKIE" \
             sh ci/zap-scan-retry.sh \
             zap-full-scan.py -t http://localhost:8080 -c .zap/full.conf \
               -j --hook=ci/zap-full-hooks.py \
               -z "$ZAP_FIREFOX_NO_PHONE_HOME" \
               -J zap-full.json -r zap-full.html; then
          echo 0 > zap-full-scan.exit
        else
          echo $? > zap-full-scan.exit
        fi
      } 2>&1 | tee zap-full-scan.log
      SCAN_EXIT=$(cat zap-full-scan.exit)
      # Coverage floor: refuse to trust a clean result from a crawl that barely ran. See
      # the ZAP_FULL_MIN_URLS comment above for what this floor does and does not prove. The
      # count comes from zap-full-url-count.txt, written by the hook's zap_pre_shutdown once the
      # spider/ajax-spider/active-scan phases finish — a missing or unparseable file means the
      # scan crashed before that point (or the hook itself failed), which fails closed exactly
      # like a missing count did under the old log-grep.
      URLS=$(cat zap-full-url-count.txt 2>/dev/null || true)
      case "$URLS" in
        ''|*[!0-9]*) URLS='' ;;
      esac
      echo "=== zap-full coverage: crawled ${URLS:-<no count reported>} URL(s), floor is $ZAP_FULL_MIN_URLS ==="
      COVERAGE_EXIT=0
      if [ -z "$URLS" ]; then
        echo "ERROR: zap-full-url-count.txt is missing or unparseable — the scan crashed before zap_pre_shutdown ran, or crawled 0 URLs. An unmeasured crawl is not a clean result." >&2
        COVERAGE_EXIT=1
      elif [ "$URLS" -lt "$ZAP_FULL_MIN_URLS" ]; then
        echo "ERROR: crawl coverage ($URLS URL(s)) is below the $ZAP_FULL_MIN_URLS floor — the AJAX spider likely did not run, so a clean result from this crawl carries little assurance." >&2
        COVERAGE_EXIT=1
      fi
      [ "$SCAN_EXIT" -eq 0 ] && [ "$COVERAGE_EXIT" -eq 0 ]
  after_script:
    # Do not print app.log: a full scan drives it to hundreds of MB (one line per probed
    # request), which overruns the runner output_limit and fails the job on log length alone.
    # The scan output already in the job trace, plus the HTML/JSON reports and app.log itself
    # below, are the diagnostics — app.log is retained as an artifact only, never dumped.
    - echo "=== dependably app log kept as a job artifact, not printed (see artifacts) ==="
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - zap-full.html
      - zap-full.json
      - zap-full-scan.log
      - zap-full-url-count.txt
      - app.log

# Authenticated API scan of the management surface (/api/v1/...). Imports the
# generated OpenAPI document so ZAP exercises every documented route instead of
# relying on a spider that can't crawl an API. ci/zap-dast-auth.sh logs in,
# clears the first-boot password-rotation flag, and emits a session cookie that
# ZAP's replacer add-on injects on every request. The scan runs with -I so a
# warning never fails it on its own; ci/zap-api-gate.py decides pass/fail and
# fails only on findings ZAP rates risk>=Medium AND confidence>=Medium. That bar
# keeps the gate deterministic — active-scanning a JSON API otherwise surfaces a
# rotating cast of low-confidence false positives (boolean-SQL row-count variance,
# path-like values echoed in JSON, reflected input in application/json) that land
# on a different rule/parameter each run — while a real injection still reds it.
# Gates every MR and the release (.release-required): a genuine authenticated-API
# finding blocks the merge so it gets fixed in-context. interruptible so a re-push
# cancels it rather than queueing on the single amd64 runner. Management routes
# accept only the session JWT, not a dpd_ token.
#
# The management and protocol surfaces scan in separate jobs, not one job running
# two scans: zap-api-scan.py boots a ZAP daemon and is built to own its container
# (it relies on the image's pre-warmed ~/.ZAP and leaves a session lock on exit),
# so a second scan in the same container can't bring up its own daemon. Each
# surface also needs a different credential the other rejects (session-JWT Cookie
# here, dpd_ Bearer for protocol), so the two cannot collapse into a single scan.
zap-api-management:
  stage: dast
  extends: [.runs-on-ci, .release-required]
  image:
    name: ${DEP_IMAGE_REGISTRY}/zaproxy/zap-stable:2.17.0@sha256:2ec1d5d5b44d55cfd02ba9b89cd26852f06d92b7fc0ce9f064b9463babc73074
    entrypoint: [""]
  needs: [build]
  tags: [amd64]
  interruptible: true
  script:
    - *app_boot
    - sh ci/zap-dast-auth.sh
    - . ./zap-creds.env
    - ln -sfn "$PWD" /zap/wrk
    # ZAP's OpenAPI import sends one request per documented operation with the live
    # session cookie injected, so it hits POST /api/v1/auth/logout and revokes the
    # session mid-scan — the rest of the management surface then scans unauthenticated
    # (a flood of "Token has been revoked" 401s). Strip the session-destroying
    # operations from the spec first so the session survives. See ci/zap-filter-openapi.py.
    # The cookie is passed inline because zap-creds.env assigns without exporting, so sourcing
    # it makes ZAP_SESSION_COOKIE a shell variable the sibling jobs expand inline — but not an
    # environment variable a child process inherits. The management spec requires an
    # authenticated session, so an unauthenticated fetch answers 401 and the job dies here.
    - ZAP_SESSION_COOKIE="$ZAP_SESSION_COOKIE" python3 ci/zap-filter-openapi.py http://localhost:8080/openapi/management.json > /zap/wrk/management-scan.json
    # -I so a warning-level alert never fails the scan on its own — ci/zap-api-gate.py
    # is the pass/fail authority (fails only on risk>=Medium AND confidence>=Medium).
    # A genuine scan/import error still exits non-zero here and fails the job.
    - >
      ZAP_AUTH_HEADER=Cookie ZAP_AUTH_HEADER_VALUE="$ZAP_SESSION_COOKIE"
      sh ci/zap-scan-retry.sh
      zap-api-scan.py -t /zap/wrk/management-scan.json
      -f openapi -O http://localhost:8080 -I
      -c .zap/api-management.conf
      -J zap-api-management.json -r zap-api-management.html
    - python3 ci/zap-api-gate.py zap-api-management.json .zap/api-management.conf
  after_script:
    # Do not print app.log: a full scan drives it to hundreds of MB (one line per probed
    # request), which overruns the runner output_limit and fails the job on log length alone.
    # The scan output already in the job trace, plus the HTML/JSON reports and app.log itself
    # below, are the diagnostics — app.log is retained as an artifact only, never dumped.
    - echo "=== dependably app log kept as a job artifact, not printed (see artifacts) ==="
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - zap-api-management.html
      - zap-api-management.json
      - app.log

# Authenticated API scan of the protocol surfaces (npm/PyPI/NuGet/…). Same
# OpenAPI import; auth is the dpd_ token as a Bearer header — TokenAuthentication
# accepts Bearer for every ecosystem, so one token covers all protocol routes
# (NuGet push via X-NuGet-ApiKey is the one documented gap). Runs with -I +
# ci/zap-api-gate.py, gates every MR and the release, interruptible — same
# rationale as zap-api-management.
zap-api-protocol:
  stage: dast
  extends: [.runs-on-ci, .release-required]
  image:
    name: ${DEP_IMAGE_REGISTRY}/zaproxy/zap-stable:2.17.0@sha256:2ec1d5d5b44d55cfd02ba9b89cd26852f06d92b7fc0ce9f064b9463babc73074
    entrypoint: [""]
  needs: [build]
  tags: [amd64]
  interruptible: true
  script:
    - *app_boot
    - sh ci/zap-dast-auth.sh
    - . ./zap-creds.env
    - ln -sfn "$PWD" /zap/wrk
    # -I so a warning-level alert never fails the scan on its own — ci/zap-api-gate.py
    # is the pass/fail authority (fails only on risk>=Medium AND confidence>=Medium).
    # A genuine scan/import error still exits non-zero here and fails the job.
    - >
      ZAP_AUTH_HEADER_VALUE="Bearer $ZAP_API_TOKEN"
      sh ci/zap-scan-retry.sh
      zap-api-scan.py -t http://localhost:8080/openapi/protocol.json
      -f openapi -O http://localhost:8080 -I
      -c .zap/api-protocol.conf
      -J zap-api-protocol.json -r zap-api-protocol.html
    - python3 ci/zap-api-gate.py zap-api-protocol.json .zap/api-protocol.conf
  after_script:
    # Do not print app.log: a full scan drives it to hundreds of MB (one line per probed
    # request), which overruns the runner output_limit and fails the job on log length alone.
    # The scan output already in the job trace, plus the HTML/JSON reports and app.log itself
    # below, are the diagnostics — app.log is retained as an artifact only, never dumped.
    - echo "=== dependably app log kept as a job artifact, not printed (see artifacts) ==="
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - zap-api-protocol.html
      - zap-api-protocol.json
      - app.log

# Single release contract. needs: is the YAML alias *release-required-jobs;
# release-contract-lint reconciles that alias against the set of jobs that
# extend .release-required and fails on drift, every push. The gate itself
# is just a pass-through that release-to-github depends on.
release-gate:
  stage: dast
  extends: .runs-on-release-tag
  image: ${DEP_IMAGE_REGISTRY}/library/alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  needs: *release-required-jobs
  script:
    - echo "release contract satisfied for $CI_COMMIT_TAG"

# === release ===

# Mirrors a release tag to GitHub: squashes everything since the previous
# vX.Y.Z tag into one commit on github/main, plus an annotated tag at the
# same SHA. Tag-triggered + serialized + ff-only + drift-detecting +
# provenance-emitting. CI owns tag identity (validate-release-tag);
# this job owns publishing only. See build/release-to-github.sh.
release-to-github:
  stage: mirror
  # Inline rules rather than `extends: .runs-on-release-tag` because the manual
  # gate has to live inside the rule: when a matching rule carries no `when:`,
  # GitLab defaults it to on_success, and that default overrides a job-level
  # `when: manual` under rules/when precedence. The YAML merge key keeps the tag
  # regex in its single home rather than duplicating it here.
  rules:
    - <<: *release-tag-rule
      when: manual
      allow_failure: false
  # release-gate proves the release contract held; deploy-staging proves the
  # exact image this tag produced actually boots on a real host. Both are named
  # explicitly because `needs:` releases a job from stage ordering — with only
  # release-gate listed, the mirror would be offered before staging had run.
  needs: [release-gate, deploy-staging]
  # See validate-release-tag for why the alpine/git entrypoint is overridden.
  image:
    name: ${DEP_IMAGE_REGISTRY}/alpine/git@sha256:d453f54c83320412aa89c391b076930bd8569bc1012285e8c68ce2d4435826a3
    entrypoint: [""]
  tags: [amd64]
  resource_group: github-release
  # Cancellation must not race a partial push.
  interruptible: false
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
  variables:
    GIT_DEPTH: 0
  script:
    - !reference [.apk-mirror-setup, script]
    - apk add --no-cache bash
    - bash build/release-to-github.sh
  artifacts:
    paths:
      - provenance.json
    expire_in: never
    when: on_success

# === publish (runtime image) ===
#
# Build the multi-arch runtime image (linux/amd64 + linux/arm64) and push it to
# the Dependably OCI registry. Two trigger paths, both post-merge:
#
#   * GREEN main push — tags `:main` and `:${FILE_VERSION}-main.<short-sha>`, so
#     dependably-integration-tests can pull it to stand up an ephemeral,
#     permissive instance for the client matrix.
#   * vX.Y.Z release tag — tags `:X.Y.Z` and `:latest`, the durable images edge
#     nodes and operators pull. validate-release-tag has already confirmed the
#     tag matches Directory.Build.props <Version>, so the tag drives the stamp.
#
# In the `release` stage with NO `needs:`, so it runs only after every earlier
# stage (build/test/sbom/dast) has passed — i.e. the pipeline is green.
#
# NOT .release-required: a side-effect publish, not a release gate, so it stays
# outside release-contract-lint. Uses buildx because the Dockerfile is
# `# syntax=docker/dockerfile:1` with `RUN --mount=type=secret` (BuildKit-only,
# matching the GitHub build) — Kaniko can't build it. This therefore needs a
# PRIVILEGED, BuildKit-capable runner (same requirement as the rpm/docker test
# suites). arm64 is cross-compiled by the Dockerfile (TARGETARCH→RID); only the
# final-stage apk layer runs under QEMU, installed via the binfmt image below.
#
# Prereqs (set as CI/CD variables):
#   REGISTRY_PUBLISH_KEY — publish:oci token for $DEP_IMAGE_REGISTRY, set PROTECTED +
#                   MASKED so it is exposed only on protected refs (`main`, `v*`) and
#                   never to a feature-branch MR pipeline. This job is the only image
#                   push besides build-ci-tools. Falls back to REGISTRY_KEY when unset
#                   so the publish path keeps working until the variable is created;
#                   delete the fallback once it exists (see CONTRIBUTING > Registry
#                   credentials in CI).
#   REGISTRY_KEY  — read-only token, unprotected. Used here ONLY as the BuildKit
#                   secret that routes the image build's own dependency restores
#                   through the private feed. It is not the push credential.
#   DOCKER_AUTH_CONFIG — base-image pull creds (already required pipeline-wide).
# Two-image publish. `parallel: matrix` fans this one definition into
# publish-image: [community] and publish-image: [edge]: the community image builds
# from Dockerfile into dependably/community; the edge image builds from
# Dockerfile.edge into dependably/edge (the slim, management-plane-free root).
# Both are multi-arch (amd64+arm64) and share the identical tag logic. IMAGE_FLAVOR
# is the sole matrix axis (GitLab names each parallel job after its matrix variable
# values, so a lone flavor keyword keeps the job names short); IMAGE_REPO and
# DOCKERFILE are derived from it in the script below, along with a per-flavor
# resource_group so the two registry pushes serialize independently rather than
# blocking each other.
publish-image:
  stage: release
  extends: .runs-on-ci-main
  image: ${DEP_IMAGE_REGISTRY}/library/docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  parallel:
    matrix:
      - IMAGE_FLAVOR: [community, edge]
  services:
    - name: ${DEP_IMAGE_REGISTRY}/library/docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce   # glsec:ignore GL054 -- buildx needs BuildKit (Dockerfiles use RUN --mount=type=secret); privileged/BuildKit runner is the documented, chosen prerequisite
      alias: docker
  tags: [amd64]   # must be a privileged / BuildKit-capable runner
  # serialize publishes so concurrent main pipelines can't race the registry (GL019);
  # per-flavor group so the community and edge pushes don't block each other.
  resource_group: publish-image-${IMAGE_FLAVOR}
  # Cancellation must not race a partial multi-arch manifest push.
  interruptible: false
  variables:
    # Talk to the dind service over its plaintext endpoint. TLS (2376) needs the
    # runner to share dind's generated /certs/client volume into the job container;
    # the self-hosted runners do not, so a TLS client finds no ca.pem and fails to
    # initialize. The dind<->client traffic stays on the job's isolated service
    # bridge network, which is never reachable outside the job.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: "" # glsec:ignore GL031 -- TLS on 2376 needs the runner to share dind's /certs/client volume into the job, which these self-hosted runners do not; the docker executor isolates the dind daemon on this job's per-build service network, so 2375 is not reachable by other jobs
  # Registry auth is split by capability: the push authenticates with
  # REGISTRY_PUBLISH_KEY (protected + masked), while build-time dependency routing
  # reuses the unprotected read-only REGISTRY_URL / REGISTRY_KEY pair the build job
  # uses. See .private-registry-setup for the rationale.
  script:
    - |
      case "$IMAGE_FLAVOR" in
        community) IMAGE_REPO="${DEP_IMAGE_REGISTRY}/dependably/community"; DOCKERFILE="Dockerfile" ;;
        edge) IMAGE_REPO="${DEP_IMAGE_REGISTRY}/dependably/edge"; DOCKERFILE="Dockerfile.edge" ;;
        *) echo "unknown IMAGE_FLAVOR: $IMAGE_FLAVOR" >&2; exit 1 ;;
      esac
    - echo "Publishing $IMAGE_FLAVOR image from $DOCKERFILE to $IMAGE_REPO"
    - |
      # The publish credential, with a fallback to the read key so the push keeps
      # working until REGISTRY_PUBLISH_KEY is created as a protected + masked
      # variable. Removing the fallback is the one manual cutover step: once the
      # variable exists, `${REGISTRY_PUBLISH_KEY:?...}` should replace it so an
      # unprotected pipeline can never reach a write-capable token.
      if [ -z "${REGISTRY_PUBLISH_KEY:-}" ]; then
        echo "WARNING: REGISTRY_PUBLISH_KEY is unset — falling back to the unprotected read token for the push. Create it as a Protected + Masked CI/CD variable and drop the fallback (CONTRIBUTING > Registry credentials in CI)." >&2
      fi
      echo "${REGISTRY_PUBLISH_KEY:-$REGISTRY_KEY}" | docker login "$DEP_IMAGE_REGISTRY" -u api --password-stdin
    # The dind service daemon comes up a few seconds after the job container, so the
    # first command that talks to it races startup ("Cannot connect to the Docker
    # daemon at tcp://docker:2375"). docker login above is a local config write and
    # does not touch the daemon, so wait for the daemon to accept connections here.
    - |
      for i in $(seq 30); do docker info >/dev/null 2>&1 && break; echo "waiting for dind ($i)..."; sleep 1; done
      docker info >/dev/null 2>&1 || { echo "dind daemon did not become ready on $DOCKER_HOST"; exit 1; }
    # Register the arm64 QEMU emulator on the amd64 dind daemon so the final-stage
    # apk layer of the arm64 image can run. Only that layer needs emulation: the
    # frontend, build, and notices stages are all pinned to --platform=$BUILDPLATFORM
    # in both Dockerfiles and cross-compile via TARGETARCH→RID, so they execute
    # natively on the amd64 runner. Dropping that pin does not fail the build — it
    # silently moves the whole SDK restore/publish under QEMU (~15x slower).
    - docker run --privileged --rm ${DEP_IMAGE_REGISTRY}/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64 # glsec:ignore GL056 -- binfmt_misc registration needs privileged (cap-add alone cannot mount /proc/sys/fs/binfmt_misc); one-shot container inside this job's isolated, already-privileged dind daemon
    - docker buildx create --use --name dep-builder
    # BuildKit secret for the image build's own npm/NuGet/apk restores — the READ
    # token, deliberately not the publish one.
    - printf '%s' "$REGISTRY_KEY" > /tmp/registry_key
    # Pick the tag set from the trigger. On a vX.Y.Z tag the tag is the source of
    # truth (validate-release-tag already matched it to Directory.Build.props):
    # publish the durable :X.Y.Z + :latest. On a main push, stamp a valid SemVer
    # prerelease (a raw SHA is not a valid .NET version string) from FILE_VERSION,
    # the source of truth in Directory.Build.props, and publish :main + :$VERSION.
    - |
      if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        VERSION="${CI_COMMIT_TAG#v}"
        VERSION_TAGS="--tag $IMAGE_REPO:$VERSION --tag $IMAGE_REPO:latest"
      else
        FILE_VERSION=$(grep -oE '<Version>[^<]+</Version>' Directory.Build.props \
          | sed -E 's|<Version>(.*)</Version>|\1|')
        # The "g" prefix keeps the SHA identifier alphanumeric: SemVer forbids leading
        # zeros in numeric prerelease identifiers, and an all-digit short SHA with a
        # leading zero is otherwise an invalid version string.
        VERSION="${FILE_VERSION}-main.g${CI_COMMIT_SHORT_SHA}"
        VERSION_TAGS="--tag $IMAGE_REPO:main --tag $IMAGE_REPO:$VERSION"
      fi
      echo "Stamping image version $VERSION"
    # The Dockerfiles' base images (NODE_IMAGE/SDK_IMAGE/RUNTIME_IMAGE) default to public
    # registries; here they're overridden to the mirror's path-flattened equivalents
    # (mcr.microsoft.com/dotnet/sdk becomes ${DEP_IMAGE_REGISTRY}/dotnet/sdk, docker.io
    # library images become ${DEP_IMAGE_REGISTRY}/library/<name>) at the same digests as
    # the Dockerfile defaults, so this multi-arch build pulls its base layers from the
    # pull-through mirror instead of the public registries directly.
    - |
      NODE_IMAGE="${DEP_IMAGE_REGISTRY}/library/node:26-alpine@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66"
      SDK_IMAGE="${DEP_IMAGE_REGISTRY}/dotnet/sdk:10.0-alpine@sha256:5c559aa5d99337e400d39ab4fa1f6979d126c29b20939d53658ed38300571e74"
      RUNTIME_IMAGE="${DEP_IMAGE_REGISTRY}/dotnet/runtime-deps:10.0-alpine@sha256:f276c0256ffca8fe816d48ba261962b54fea1b0e6f870b6a60b3b705c89e78ac"
    # Fail fast, with a readable message, if the mirror is missing a linux/arm64 manifest for
    # either multi-arch base image, rather than surfacing as a bare "no match for platform" deep
    # inside the multi-stage buildx log below. NODE_IMAGE is skipped: both Dockerfiles pin it to
    # $BUILDPLATFORM, so it never needs a target-arch manifest.
    - |
      for MULTIARCH_IMAGE in "$SDK_IMAGE" "$RUNTIME_IMAGE"; do
        if ! docker buildx imagetools inspect "$MULTIARCH_IMAGE" | grep -q 'linux/arm64'; then
          echo "ERROR: $MULTIARCH_IMAGE has no linux/arm64 manifest on the mirror — refusing to start the multi-arch build." >&2
          exit 1
        fi
      done
    - >-
      docker buildx build
      -f "$DOCKERFILE"
      --platform linux/amd64,linux/arm64
      --provenance=false
      --build-arg VERSION="$VERSION"
      --build-arg REGISTRY_URL="$REGISTRY_URL"
      --build-arg NODE_IMAGE="$NODE_IMAGE"
      --build-arg SDK_IMAGE="$SDK_IMAGE"
      --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE"
      --secret id=registry_key,src=/tmp/registry_key
      $VERSION_TAGS
      --push .
    - rm -f /tmp/registry_key

# === staging ===
#
# Deploy the image publish-image just pushed onto the staging host, and prove it
# boots there before a release tag can be mirrored. Runs on the shell runner
# registered on that host carrying the single tag `staging` with
# run_untagged=false, so the host executes this job and nothing else in the
# pipeline — it is a deploy target, not build capacity.
#
# Deliberately has NO `needs:`. Stage ordering alone makes it wait for every
# publish-image matrix job, which is exactly the precondition: the image must be
# in the registry before it can be pulled. Adding `needs:` would release this
# job from stage ordering and let it start against an image not yet pushed.
#
# `dependencies: []` because the host needs only the checkout (the compose file
# and Directory.Build.props). Without it GitLab would ship every earlier stage's
# artifacts — SBOMs, ZAP reports, provenance — onto a small shared host for no
# reason.
#
# Prereqs (already set as CI/CD variables):
#   REGISTRY_KEY — the read-only pull token, unprotected so it resolves on main
#                  and tag pipelines alike. It reaches the host only for the
#                  lifetime of this job and the trap removes it; the staging
#                  host holds no standing registry credential of its own.
deploy-staging:
  stage: staging
  extends: .runs-on-ci-main
  tags: [staging]
  dependencies: []
  # Two main pipelines finishing close together must not race each other's
  # `compose up` against the same host.
  resource_group: staging-deploy
  # Cancellation must not leave the host stranded between two images.
  interruptible: false
  variables:
    GIT_DEPTH: 1
    STAGING_PORT: "8080"
    # The host's own env file, carrying its identity and tenancy mode (BASE_URL,
    # DEPLOYMENT_MODE, DEFAULT_ORG_SLUG). Deliberately on the host rather than in
    # CI variables: it describes the machine, not the build, so it survives
    # pipeline edits and differs per staging host.
    STAGING_ENV_FILE: /etc/dependably/staging.env
    # Deliberately the SAME compose project as the appliance already running on
    # the host. Compose then recreates that container in place — it stops the old
    # one before starting the replacement, so the port is never double-bound and
    # two processes can never hold the one SQLite database open at once. A
    # separate project would leave the original container owning both.
    COMPOSE_PROJECT: dependably-community
  environment:
    # glsec's static check doesn't resolve GitLab `extends:` merging (the same gap
    # already accepted for GL022/024/026/032 above): the job's actual rules come
    # from `extends: .runs-on-ci-main` (main push + release tag only) — confirmed
    # live by release-contract-lint's RULE_PROVIDERS check and by `glab ci lint`.
    name: staging  # glsec:ignore GL013 -- rules inherited via extends: .runs-on-ci-main, see above
    url: http://rpi2.northwardlabs.ca:8080
  script:
    # One block, so the logout trap covers every command that follows the login.
    - |
      set -eu

      # Resolve the same tag publish-image stamped in this pipeline. A moving tag
      # (:main, :latest) would let a concurrent pipeline substitute a different
      # build between that push and this pull, so the immutable version-stamped
      # tag is the only safe reference to deploy.
      if echo "${CI_COMMIT_TAG:-}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        FILE_VERSION=$(grep -oE '<Version>[^<]+</Version>' Directory.Build.props \
          | sed -E 's|<Version>(.*)</Version>|\1|')
        VERSION="${FILE_VERSION}-main.g${CI_COMMIT_SHORT_SHA}"
      fi
      export STAGING_IMAGE="${DEP_IMAGE_REGISTRY}/dependably/community:${VERSION}"
      echo "Deploying $STAGING_IMAGE to staging"

      trap 'docker logout "$DEP_IMAGE_REGISTRY" >/dev/null 2>&1 || true' EXIT
      echo "$REGISTRY_KEY" | docker login "$DEP_IMAGE_REGISTRY" -u api --password-stdin

      COMPOSE="docker compose -p $COMPOSE_PROJECT -f docker-compose.staging.yml"
      # Absent env file falls back to the compose defaults rather than failing:
      # `--env-file` pointing at a missing path is a hard error in compose, which
      # would break the deploy on a freshly provisioned host for a file that is
      # host configuration, not a build input. Warn loudly instead — a silently
      # default-configured staging box is the confusing outcome to avoid.
      if [ -f "$STAGING_ENV_FILE" ]; then
        COMPOSE="$COMPOSE --env-file $STAGING_ENV_FILE"
        echo "Using host env file $STAGING_ENV_FILE"
      else
        echo "WARNING: $STAGING_ENV_FILE is absent — deploying with docker-compose.staging.yml defaults (single-tenant, default org)." >&2
      fi

      $COMPOSE pull
      $COMPOSE up -d --remove-orphans

      CID=$($COMPOSE ps -q dependably)
      [ -n "$CID" ] || { echo "deploy-staging: no container id for service dependably" >&2; exit 1; }

      # The image the container actually runs must be the one this pipeline built.
      # Guards against compose reusing an existing container whose image differs.
      RUNNING_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$CID")
      if [ "$RUNNING_IMAGE" != "$STAGING_IMAGE" ]; then
        echo "deploy-staging: expected $STAGING_IMAGE but container runs $RUNNING_IMAGE" >&2
        exit 1
      fi

      # A started container is not a working one. Block on the image's own
      # HEALTHCHECK (the image's own /ready probe) so a boot failure — a bad migration, a schema
      # change the previous release cannot read — fails this job rather than
      # leaving a dead container behind a green pipeline.
      STATUS=unknown
      for _ in $(seq 90); do
        STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo unknown)
        case "$STATUS" in
          healthy) break ;;
          unhealthy) break ;;
        esac
        sleep 2
      done
      if [ "$STATUS" != healthy ]; then
        echo "deploy-staging: container did not become healthy (last status: $STATUS)" >&2
        docker logs --tail 200 "$CID" >&2 || true
        exit 1
      fi
      echo "deploy-staging: $STAGING_IMAGE healthy on port ${STAGING_PORT}"
