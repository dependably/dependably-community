# ZAP API scan rule overrides for the authenticated management API
# (/openapi/management.json -> /api/v1/...).
# Tab-separated: <ruleId> <action> <comment>; action is IGNORE|WARN|FAIL.
# Triaged from the first authenticated main run.
#
# Pass/fail is decided by ci/zap-api-gate.py (risk>=Medium AND confidence>=Medium),
# not by this file — the scan runs with -I so its own exit code never fails on a
# warning. These IGNOREs only keep known low-value noise out of the report; the gate
# would filter every rule below the threshold anyway.

# Operator user-search passes an email filter as a query param. Emails are not
# credentials, and the flagged value is ZAP's own injected probe, not a leak.
10024	IGNORE	(Email in URL - search filter, not a secret)
# Error bodies are application/problem+json where ZAP expects another type.
100001	IGNORE	(Unexpected Content-Type on problem+json error responses)
# Cross-Origin-Resource-Policy not required for the JSON management API.
90004	IGNORE	(CORP header absent - accepted)
# ZAP raises both its client-error (4xx) and server-error (5xx) alerts under this one
# rule id, so accept-listing it accepts both. The 4xx are expected: schema-fuzzed probes
# and system-admin-only routes (owner gets 403). A 5xx is NOT accepted noise — it does not
# block, but ci/zap-api-gate.py breaks server errors out into their own advisory section so
# a 500 on a benign request stays visible instead of blending into this rule's 4xx volume.
100000	IGNORE	(Client 4xx + server 5xx response codes - 4xx are expected probe results; 5xx listed separately by ci/zap-api-gate.py)
10049	IGNORE	(Storable/Non-Storable Content - informational)
10104	IGNORE	(User Agent Fuzzer - informational active-scan probe)
10111	IGNORE	(Authentication Request Identified - informational, login form)
# Luhn/BIN heuristic matches a digit run inside the W3C trace id echoed on responses
# (traceparent / problem+json traceId); no payment or PII data exists on this surface.
10062	IGNORE	(PII Disclosure - Luhn FP on echoed trace-id digit runs, not real PII)
# Stored-echo false positive on the license-policy allow/blocklist. The POST persists
# licenseSpdx verbatim and the list GET returns every value the scan has stored, on one
# line of JSON, alongside 32-char hex ids and fractional timestamps. ZAP's check is
# "[\w\W]*zj.*<sum>.*zj[\w\W]*" — the arithmetic result only has to appear somewhere
# BETWEEN two zj markers, not delimited by them — and the rule hardcodes confidence to
# HIGH, so a High/High alert here carries no evidential weight. Its probe numbers are
# 5-digit multiples of ten drawn from 8790 values, so a digit collision against the
# accumulated list is expected over a full scan; the alert migrates between the allowlist
# and blocklist params run to run and clears on retry.
#
# It cannot be a true positive: the solution contains no template engine and no expression
# evaluator (no Razor/cshtml, Scriban, Fluid, Handlebars, DotLiquid, NCalc, CSharpScript),
# and SPDX handling is LicenseNormalizer dictionary lookup that passes unknown strings
# through unchanged. Revisit if a templating or evaluation dependency is ever introduced.
90035	IGNORE	(SSTI - stored-echo FP on license-policy allow/blocklist; no template engine exists)
