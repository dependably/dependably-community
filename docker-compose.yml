services:
  dependably:
    build:
      context: .
      args:
        REGISTRY_URL: ${REGISTRY_URL:-}
      # The private-registry credential is a BuildKit secret, not a build arg —
      # build args persist in image history; secret mounts do not. The secret
      # resolves from the REGISTRY_KEY environment variable (empty when unset,
      # which the Dockerfile treats as "no private registry").
      secrets:
        - registry_key
    ports:
      - "8080:8080"
    volumes:
      - dependably-data:/data
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:-default}
      # Single-tenant appliance by default. Set DEPLOYMENT_MODE=multi for
      # subdomain-routed multi-tenancy — the apex domain is the host portion of
      # BASE_URL; per-tenant access is via slug.apexhost (a bare host resolves
      # to apex and hides per-tenant login methods such as SAML).
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-single}
      # No load balancer fronts a single-node compose appliance, so the pre-stop
      # drain sleep buys nothing here and would only eat into the stop grace
      # period before the SQLite instance-lock row is released. Pinned to the
      # app default (0) so shutdown proceeds straight to the drain + lock release.
      SHUTDOWN_PRESTOP_DELAY: ${SHUTDOWN_PRESTOP_DELAY:-0}
      # RPM upstream proxy. There is no canonical default RPM repo (distro/release
      # specific), so this is opt-in via env — here the demo points at Fedora 40
      # (archived tree, matching the fedora:40 integration-test fixture).
      Rpm__Upstream: ${RPM_UPSTREAM:-https://archives.fedoraproject.org/pub/archive/fedora/linux/releases/40/Everything/x86_64/os}
      Rpm__UpstreamMode: ${RPM_UPSTREAM_MODE:-passthrough}
      # Container image scanning, off by default. With it on, pushed and pulled images
      # are queued for the image scanner (the oci-scan profile below), and OCI versions
      # take their status from its results. See OPERATIONS.md > OCI image scanning.
      OCI_SCAN_ENABLED: ${OCI_SCAN_ENABLED:-false}
      # GC heap cap — prevents OOM-kill on memory-constrained hosts (ARM64, Raspberry Pi).
      # Set to ~75 % of the container mem_limit. The .NET runtime reads this at process
      # start; changing it while the container is running has no effect. Leave unset on
      # large hosts (8 GiB+). Uncomment the line that matches your host:
      #   1 GiB host  → 0x30000000  (768 MiB)
      #   2 GiB host  → 0x60000000  (1.5 GiB)   <- typical Pi 4 / small VPS
      #   4 GiB host  → 0xC0000000  (3 GiB)
      # DOTNET_GCHeapHardLimit: "0x60000000"
      # - STAGING_DISK_WARN_THRESHOLD_PERCENT=10
    # start_period covers the schema apply, not a normal boot — a migration killed mid-pass is
    # not ledgered and repeats on every restart. See the Dockerfile HEALTHCHECK for the full note.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Must cover SHUTDOWN_PRESTOP_DELAY + SHUTDOWN_GRACE_PERIOD (30s in-flight
    # drain) so graceful shutdown finishes and the SQLite instance-lock row is
    # deleted. Docker's default 10s SIGKILLs mid-shutdown, which drops the
    # queue flushes and orphans the lock — the replacement container then has to
    # wait out the 90s staleness window before it can take over.
    stop_grace_period: 45s

  # The OCI image scanner, started only with `--profile oci-scan` (and OCI_SCAN_ENABLED=true
  # above). The image is not publicly distributed yet: it is pulled from the private
  # registry, so leave the profile off without access to it. Dependably runs fully without
  # it; OCI images then read no_feed. It reads each queued image through Dependably's scan
  # API and posts the result;
  # it never touches the database. It shares the dependably service's network namespace
  # and calls it on localhost, which single-org mode always resolves to the one org.
  # In multi-tenant mode, set OCI_SCANNER_DEPENDABLY_URL to the tenant's own https://<slug>.<domain>.
  oci-scanner:
    image: ${DEP_IMAGE_REGISTRY:-dependably.northwardlabs.ca}/dependably/oci-scanner:${OCI_SCANNER_TAG:-0.2.0}
    profiles: [oci-scan]
    network_mode: service:dependably
    depends_on:
      dependably:
        condition: service_healthy
    environment:
      DEPENDABLY_URL: ${OCI_SCANNER_DEPENDABLY_URL:-http://localhost:8080}
      # A service token minted with the "OCI image scanner" preset (scan:oci only).
      DEPENDABLY_TOKEN_FILE: /run/secrets/oci_scanner_token
      # remote queries api.osv.dev (or OSV_BASE_URL); local reads OSV dumps from OSV_LOCAL_PATH.
      OSV_SOURCE: ${OCI_SCANNER_OSV_SOURCE:-remote}
      SCAN_PLATFORMS: ${OCI_SCANNER_PLATFORMS:-linux/amd64,linux/arm64}
    secrets:
      - oci_scanner_token
    # One image at a time, replayed in memory: no writable filesystem, no capabilities.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    restart: unless-stopped

volumes:
  dependably-data:

secrets:
  registry_key:
    environment: REGISTRY_KEY
  oci_scanner_token:
    environment: OCI_SCANNER_TOKEN
